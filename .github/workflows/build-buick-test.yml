name: Build Buick-Test and publish isolated test update

on:
  workflow_dispatch:
  push:
    branches: [Buick-Test]

concurrency:
  group: cardeck-buick-test-latest
  cancel-in-progress: false

jobs:
  test-build:
    if: github.ref == 'refs/heads/Buick-Test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Read isolated update channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          c = json.loads(Path('app/src/main/assets/config/update-channel.json').read_text())
          assert c['branch'] == os.environ['GITHUB_REF_NAME'] == 'Buick-Test'
          assert c['repository'] == os.environ['GITHUB_REPOSITORY']
          assert c['releaseTag'] == 'buick-test-latest'
          assert re.fullmatch(r'[A-Za-z0-9_-]+\.apk', c['apkName'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"RELEASE_TAG={c['releaseTag']}\nAPK_NAME={c['apkName']}\n")
          PY
      - name: Validate Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          # Human-readable notes must be maintained in Chinese, never copied from the git commit.
          # Fail closed if the latest commit omitted release notes, to prevent stale descriptions.
          test -s docs/BUICK_TEST_RELEASE_NOTES.md
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 &&
              git diff --quiet HEAD^ HEAD -- docs/BUICK_TEST_RELEASE_NOTES.md; then
            echo "::error::请在本次提交中更新 docs/BUICK_TEST_RELEASE_NOTES.md（中文更新说明）"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          notes = Path('docs/BUICK_TEST_RELEASE_NOTES.md').read_text(encoding='utf-8')
          assert any('一' <= char <= '鿿' for char in notes), '更新说明必须包含中文'
          assert len(notes.strip()) >= 30, '更新说明不能过短'
          print('中文更新说明已验证')
          PY
      - name: Restore existing APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing existing CarDeck signing secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-test-upload.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-test-upload.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-test-upload.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Verify entry configuration and channel isolation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*EntryAddressTest' --tests '*UpdateChannelTest' --tests '*GatewayProbeTest' --tests '*LogRedactorTest' --stacktrace
      - name: Verify Gateway status protocol and query isolation
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/gateway/requirements.txt
          python3 tools/mcp/test_server.py
          python3 tools/gateway/test_log_archive.py
          python3 tools/gateway/test_gateway.py
      - name: Run all Android unit tests (required)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Check Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assign test build version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          CODE=$(( BUILD_EPOCH - 1704067200 ))
          (( CODE > 0 && CODE <= 2100000000 ))
          echo "CARDECK_BUILD_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: Build signed test APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify APK package ID, visible app label and entry components
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "package: name='io.github.buick.test.cardeck'" <<< "$BADGING"
          grep -Fq "application-label:'CarDeck-Buick-Test'" <<< "$BADGING"
          MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          grep -Fq 'io.github.shaonialife.cardeck.SenderApp' <<< "$MANIFEST"
          grep -Fq 'io.github.shaonialife.cardeck.MainActivity' <<< "$MANIFEST"
          echo "Verified independent APK identity: Buick-Test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Buick-Test-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Publish test channel only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = Buick-Test
          test "$RELEASE_TAG" = buick-test-latest
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          PREVIOUS_CODE="$(gh release view "$RELEASE_TAG" --json body --jq '.body' 2>/dev/null | sed -n 's/^versionCode=//p' | head -n 1 || true)"
          if [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] && (( CARDECK_BUILD_VERSION_CODE <= PREVIOUS_CODE )); then
            echo "A newer test build has already been published"
            exit 0
          fi
          {
            printf 'versionName=%s\nversionCode=%s\nbranch=Buick-Test\ncommit=%s\n' \
              "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$GITHUB_SHA"
            printf '\n## 更新说明\n'
            cat docs/BUICK_TEST_RELEASE_NOTES.md
          } > test-release-notes.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "CarDeck 别克测试版 $CARDECK_RELEASE_VERSION_NAME" \
              --notes-file test-release-notes.txt --prerelease --latest=false
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --target "$GITHUB_SHA" \
              --title "CarDeck 别克测试版 $CARDECK_RELEASE_VERSION_NAME" \
              --notes-file test-release-notes.txt --prerelease --latest=false
          fi
