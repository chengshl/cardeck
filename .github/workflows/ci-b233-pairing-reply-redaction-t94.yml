name: B233 pairing reply diagnostics redaction (offline only)
on:
  pull_request:
    branches: [experiment/buick-b233-rtsp-reader-retirement-t94]
    paths:
      - '.github/workflows/ci-b233-pairing-reply-redaction-t94.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233PairingReplySummary.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233PairingReplySummaryTest.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-pairing-redaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact reviewed parent and four-file B233-only scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=b1ec0c771a98bc3cbab3a52c4f2b8bffe70145d1
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41243230070 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41243230070 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-pairing-reply-redaction-t94.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233PairingReplySummary.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233PairingReplySummaryTest.kt' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          pairing = src.split('private fun postPairing(',1)[1].split('private fun request(',1)[0]
          assert 'if (endpoint.isBuickB233)' in pairing
          assert 'B233PairingReplySummary.describe(statusLine, responseBody)' in pairing
          assert pairing.index('B233PairingReplySummary.describe') < pairing.index('val headHex =')
          assert 'if (!statusLine.contains("200"))' in pairing
          helper = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/B233PairingReplySummary.kt').read_text()
          assert 'responseBody.size' in helper and 'redacted' in helper
          assert 'responseBody.take(' not in helper and 'joinToString' not in helper
          print('B233 pairing reply redaction wired; legacy non-B233 path retained')
          PY
      - name: Pairing diagnostics privacy negative regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.B233PairingReplySummaryTest --stacktrace
      - name: Complete Android JUnit, Lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 Draft only: no signing, Release, install, pairing protocol or stable merge.
