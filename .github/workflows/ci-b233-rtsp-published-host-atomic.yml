name: B233 RTSP published-route metadata atomicity (offline)
on:
  push:
    branches:
      - experiment/buick-b233-rtsp-published-host-atomic-t94
  pull_request:
    branches:
      - experiment/buick-b233-rtsp-header-retention-privacy-t94
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-rtsp-published-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact parent, scope and old-versus-new atomicity regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=9081af4b43a78fa4ec3bb5f50d12194df30dedfe
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41305989002 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41305989002 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-rtsp-published-host-atomic.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          git show "$BASE":app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt > /tmp/parent.kt
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/parent.kt').read_text()
          new = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          def publication(s):
              return s.split('val decision = synchronized(rtspWriteLock) {',1)[1].split('if (decision !=',1)[0]
          def retirement(s):
              return s.split('val retiredWaiters = if (endpoint.isBuickB233) {',1)[1].split('} else {',1)[0]
          # Negative control: the verified parent exposed socket before host/route.
          assert 'activeHost = addressLiteral(address)' not in publication(old)
          assert 'activeAddress = address' not in publication(old)
          assert 'activeHost = null' not in retirement(old)
          assert 'activeAddress = null' not in retirement(old)
          # Current B233 socket publication and retirement share rtspWriteLock.
          pub = publication(new)
          assert 'activeAddress = address' in pub
          assert 'activeHost = addressLiteral(address)' in pub
          assert pub.index('activeAddress = address') < pub.index('socket = newSocket')
          assert pub.index('activeHost = addressLiteral(address)') < pub.index('socket = newSocket')
          ret = retirement(new)
          assert 'activeHost = null' in ret and 'activeAddress = null' in ret
          assert ret.index('readerGeneration++') < ret.index('activeHost = null')
          assert 'if (!endpoint.isBuickB233) {\n            activeHost = null\n            activeAddress = null' in new
          # Legacy route assignment remains in its preexisting else branch.
          assert 'else {\n                    socket = newSocket\n                    activeAddress = address\n                    activeHost = addressLiteral(address)' in new
          print('Negative control reproduced: B233 socket/route publish and retirement now atomic')
          PY
      - name: Full Android JUnit, Lint and Debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# Offline-only B233 race repair. No signing, APK release, installation or stable merge.
