name: B233 modesChanged RTSP response strict status (offline)
on:
  pull_request:
    branches:
      - experiment/buick-b233-rtsp-peer-cseq-routing-integration-t94
    paths:
      - '.github/workflows/ci-b233-modes-reply-status-t94.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummary.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummaryTest.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-modes-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact parent CI, scope and B233 production wiring
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=b9e63e3d5517a4b9684de179e1035373fb94e487
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/modes-status-actual
          printf '%s\n' \
            '.github/workflows/ci-b233-modes-reply-status-t94.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummary.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummaryTest.kt' > /tmp/modes-status-expected
          diff -u /tmp/modes-status-expected /tmp/modes-status-actual
          git diff --check "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41272558879 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41272558879 --jq .conclusion)" = success
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          block=p.split('    fun assertModes(',1)[1].split('    /**\n     * SETUP #1',1)[0]
          assert 'B233ModeReplySummary.isTransportAccepted(statusLine, endpoint.isBuickB233)' in block
          assert 'B233ModeReplySummary.safeTransportStatus(statusLine, endpoint.isBuickB233)' in block
          assert 'B233ModeReplySummary.safeTransportError(error, endpoint.isBuickB233)' in block
          assert 'statusLine.contains("200")' not in block
          helper=Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummary.kt').read_text()
          assert 'B233PairingReplySummary.isSuccessfulPairingStatus(statusLine)' in helper
          assert 'else statusLine.contains("200")' in helper
          assert 'B233PairingReplySummary.safeStatus(statusLine)' in helper
          PY
      - name: B233 mode response positive and negative JVM regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.B233ModeReplySummaryTest --stacktrace
      - name: Full Android JUnit, Lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

