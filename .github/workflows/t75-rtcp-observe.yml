name: T75 RTCP experiment build and isolated prerelease
on:
  push:
    branches:
      - experiment/buick-test-t75-rtcp-observe
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests, lint, isolated debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Buick-T75-RTCP-OBS-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Restore Buick-Test signing key for standalone experiment (no publishing)
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t75.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t75.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t75.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Assign T75 isolated version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          echo "CARDECK_BUILD_VERSION_CODE=$(( BUILD_EPOCH - 1704067200 ))" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: Build signed T75 artifact (not a release)
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='io.github.buick.test.cardeck'"
          "$APKSIGNER" verify "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi 'CN=Android Debug'; then
            echo "::error::不能交付debug签名的替换安装包"
            exit 1
          fi
          cp "$APK" CarDeck-Buick-Test-T75-RTCP-OBS.apk
          sha256sum CarDeck-Buick-Test-T75-RTCP-OBS.apk > CarDeck-Buick-Test-T75-RTCP-OBS.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T75-RTCP-OBS-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T75-RTCP-OBS.apk
            CarDeck-Buick-Test-T75-RTCP-OBS.apk.sha256
          if-no-files-found: error
      - name: Publish selected T75 only to isolated prerelease (never stable latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t75-rtcp-observe"
          test -s app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt
          TAG="exp-buick-test-t75-$CARDECK_RELEASE_VERSION_NAME"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK="CarDeck-Buick-Test-T75-RTCP-OBS.apk"
          test -s "$APK" && test -s "$APK.sha256"
          {
            printf 'artifactKind=experiment\nupdaterSchema=1\nbaseBranch=Buick-Test\nsourceBranch=%s\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## 更新说明\n'
            printf 'T75只读音频诊断：记录反向RTCP头部、累计包数和连接后前30秒的间隔。尚未解决20秒断连，待B233实车验证。\n'
          } > t75-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Buick-Test T75 音频诊断实验 $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t75-experiment-release.txt --prerelease --latest=false
