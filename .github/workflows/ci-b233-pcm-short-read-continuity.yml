name: B233 PCM AudioRecord short-read continuity (offline)

on:
  pull_request:
    branches: [experiment/buick-b233-projection-owner-regrant-guard]
    paths:
      - '.github/workflows/ci-b233-pcm-short-read-continuity.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/audio/PcmCaptureFrameWindow.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/audio/PcmCaptureFrameWindowTest.kt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: b233-audio-short-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact signed T91 ancestor, five-file scope and runtime wiring
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=5565df378ad139ebbb7902068dd273bb09b25149
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41183730099 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41183730099 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD > /tmp/b233-short-read-scope
          test "$(wc -l < /tmp/b233-short-read-scope)" -eq 5
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/ci-b233-pcm-short-read-continuity.yml|app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt|app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt|app/src/main/java/io/github/shaonialife/cardeck/audio/PcmCaptureFrameWindow.kt|app/src/test/java/io/github/shaonialife/cardeck/audio/PcmCaptureFrameWindowTest.kt) ;;
              *) echo "::error::Unexpected changed file: $f"; exit 1 ;;
            esac
          done < /tmp/b233-short-read-scope
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          sender = Path('app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt').read_text()
          ctrl = Path('app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt').read_text()
          gate = Path('app/src/main/java/io/github/shaonialife/cardeck/audio/PcmCaptureFrameWindow.kt').read_text()
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/audio/PcmCaptureFrameWindowTest.kt').read_text()
          assert 'completePartialPcmReads = client.currentEndpoint.isBuickB233 && profile.codec == AudioCodec.PCM' in ctrl
          assert 'private val completePartialPcmReads: Boolean = false' in sender
          start = sender.split('private fun runCaptureLoop() {',1)[1].split('// ----',1)[0]
          assert 'PcmCaptureFrameWindow(frameBytes)' in start
          assert 'readWindow?.offset ?: 0' in start
          assert 'readWindow?.remaining ?: pcm.size' in start
          assert 'if (!readWindow.accept(bytesRead)) continue' in start
          assert 'frameBytes' in start
          assert 'if (bytesRead < frameBytes) continue' in start
          assert start.index('if (!readWindow.accept(bytesRead)) continue') < start.index('val payloads: List<ByteArray>')
          assert 'require(bytes >= 0 && bytes <= remaining)' in gate
          assert 'readWindow.accept(0)' in start
          assert 'val captureState = readWindow?.let { " " + it.diagnosticSummary() } ?: ""' in start
          assert 'AUDIO T94: B233 PCM capture shutdown' in start
          assert 'shortReads=$shortReadCount zeroReads=$zeroReadCount' in gate
          assert 'discardedByteCount += pendingBytes.toLong()' in gate
          for name in ('numericSummaryShowsWhetherShortReadsReallyHappenedWithoutSamples',
                       'errorResetSummaryCountsOnlyActuallyDiscardedPartialBytes',
                       'partialReadsMustAccumulateBeforeAnyRtpTimestampOrSequenceProgress',
                       'temporaryZeroReadCannotAdvanceOrLosePendingSamples',
                       'captureErrorDropsOnlyIncompleteWindowAndNeverSplicesOldAndNewAudio',
                       'readerCannotOverfillFrameOrAcceptInvalidSizes'):
              assert name in tests
          # PR #90 B233 credential redaction must remain effective.
          assert 'channel.suppressSensitiveRawFrames()' in Path('app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt').read_text()
          PY
      - name: Synthetic short-read continuity regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.audio.PcmCaptureFrameWindowTest --stacktrace
      - name: Full Android JUnit, Lint and Debug compile
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# No signing, Release, permission change, stable merge or real-car claim.
