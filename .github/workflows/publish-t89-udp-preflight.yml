name: T89 B233 Same-UID UDP Bind Preflight Signed (isolated)
on:
  push:
    branches:
      - experiment/buick-test-t89-pcm-reverse-rtcp
    paths:
      - '.github/workflows/publish-t89-udp-preflight.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-t89-udp-preflight
  cancel-in-progress: false
jobs:
  signed-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Gate exact validated T89 code and source/project identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VALIDATED="e9a35e1f955bd436447e5575b8cf7dce21e60db9"
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t89-pcm-reverse-rtcp"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$VALIDATED" "$GITHUB_SHA"
          DIFF="$(git diff --name-only "$VALIDATED" "$GITHUB_SHA")"
          test "$DIFF" = '.github/workflows/publish-t89-udp-preflight.yml' || {
            echo "::error::T89 code changed after offline validation: $DIFF"
            exit 1
          }
          # If the offline run is still in progress, wait for its actual result.
          for i in $(seq 1 24); do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41007451161" --jq '.status')"
            if [ "$STATUS" = completed ]; then break; fi
            sleep 10
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41007451161" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41007451161" --jq '.head_sha')" = "$VALIDATED"
          grep -Fq 'b233NetworkForAudioFreePreflight' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          grep -Fq 'mode=receive_only' app/src/main/java/io/github/shaonialife/cardeck/BuickMenuActivity.kt
          grep -Fq 'network.bindSocket(udp)' app/src/main/java/io/github/shaonialife/cardeck/BuickMenuActivity.kt
          grep -Fq 'if (port == 0) return null' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 't89OnlyB233PcmMediaAdvertisesReceiveOnlyReversePort' app/src/test/java/io/github/shaonialife/cardeck/audio/BuickAudioTimingPolicyTest.kt
          echo "T89 signed preflight gate passed: same-UID existing vehicle Network, read-only UDP listener, offline CI success"
      - name: Verify Android tests lint and debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Load existing signed Buick-Test keystore
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t89.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t89.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t89.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Monotonically increase Test versionCode
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89196689
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify original Test certificate, package, version and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        shell:
          bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" |
            grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" |
            grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/t89-cert.txt"
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t89-cert.txt" | head -n 1)"
          test -n "$NEW_CERT" && ! grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t89-cert.txt"
          mkdir -p "$RUNNER_TEMP/t88-reference"
          gh release download exp-buick-test-t88-20261029165129 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk' \
            --dir "$RUNNER_TEMP/t88-reference"
          OLD_APK="$RUNNER_TEMP/t88-reference/CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" > "$RUNNER_TEMP/t88-cert.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t88-cert.txt" | head -n 1)"
          test -n "$OLD_CERT" && test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::Test certificate differs from signed T88"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T89-SAME-UID-UDP-PREFLIGHT.apk
          sha256sum CarDeck-Buick-Test-T89-SAME-UID-UDP-PREFLIGHT.apk > CarDeck-Buick-Test-T89-SAME-UID-UDP-PREFLIGHT.apk.sha256
      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T89-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T89-SAME-UID-UDP-PREFLIGHT.apk
            CarDeck-Buick-Test-T89-SAME-UID-UDP-PREFLIGHT.apk.sha256
          if-no-files-found: error
      - name: Publish one isolated T89 experiment prerelease (not stable latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t89-pcm-reverse-rtcp"
          APK="CarDeck-Buick-Test-T89-SAME-UID-UDP-PREFLIGHT.apk"
          TAG="exp-buick-test-t89-$CARDECK_RELEASE_VERSION_NAME"
          test -s "$APK" && test -s "$APK.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing T89 release $TAG"
            exit 1
          fi
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T89 same-UID WiFi UDP preflight FIRST; NOT an audio fix\n'
            printf 'Signed one-off L3 prerelease using existing Buick-Test certificate. The manual menu preflight uses the EXACT WifiCarPlayConnector.currentNetwork the production T89 audio sender would use. It does not request networks, change VPN, start audio or send UDP. No stable code or release touched.\n'
            printf '\n## Stage 1: only one 25s parked-car audio-free bind check\n'
            printf 'Install over existing signed Test app, keep data and VPN unchanged. Safely park, connect the B233 video-only CarPlay session with AUDIO OFF. Test app > Buick menu > T89 network preflight. Start once. PASS requires successful Network.bindSocket, port alive for a full 25s after bind, same vehicle network/UID throughout. Log only fixed errno label, success, port validity and listener exit. If EPERM, no vehicle network, listener exit or profile fallback occurs, STOP: T89 PCM experiment is NOT valid. Do not switch VPN as part of this test. If precheck cannot start, do not test audio.\n'
            printf '\n## Stage 2: only after confirmed Stage 1 pass\n'
            printf 'In same Test app, explicitly start a new B233 CarPlay attempt with AUDIO ENABLED. A valid T89 PCM/type100 experiment requires audio SETUP reporting nonzero phone-local reverse controlPort, RECORD+first RTP and listener alive across previous ~20s failure window. If route bind fails, listener exits or codec falls back, mark INVALID rather than audio-fix failure. If still EOF near 20s, mark T89 ineffective and stop. If >40s, only preliminary, then original 3x>=3min audible/video/touch/reconnect acceptance. No T85/T88 repeat.\n'
            printf '\n## Rollback\n'
            printf 'Same Test applicationId with original T88 certificate and increased versionCode: update Test in place, do NOT uninstall or clear data. Test cannot in-place downgrade to the lower-code T88. Distinct stable Buick-E5 app remains separate; no stable merge or audio-fix claim without actual device proof.\n'
          } > release-notes.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T89 Same-UID UDP Bind Preflight $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file release-notes.txt --prerelease --latest=false
