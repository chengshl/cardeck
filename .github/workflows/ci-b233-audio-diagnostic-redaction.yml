name: B233 audio diagnostics redaction (offline)
on:
  push:
    branches:
      - experiment/buick-b233-audio-diagnostic-redaction-t94
  pull_request:
    branches:
      - experiment/buick-b233-rtcp-startup-failclosed-t94
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-audio-redaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact successful parent, old-code negative control and isolated B233 log scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=47992222cf77d70f6c606b8db17a0aedfb1445a0
          test "$(git rev-parse "$BASE")" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41388382065 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41388382065 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-audio-diagnostic-redaction.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/audio/AudioVehicleNetworkBindGuardTest.kt' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '47992222cf77d70f6c606b8db17a0aedfb1445a0'
          path = 'app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt'
          old = subprocess.check_output(['git','show',base+':'+path], text=True)
          new = Path(path).read_text()
          assert 'internal fun audioDiagnosticPeer(' not in old
          assert 'internal fun audioDiagnosticFailure(' not in old
          assert '→ $host:$dataPort' in old
          assert '→ $host:$controlPort' in old
          assert 'onSyncPortRefused?.invoke(message)' in old
          assert 'internal fun audioDiagnosticPeer(' in new
          assert 'internal fun audioDiagnosticFailure(' in new
          assert new.count('audioDiagnosticPeer(host,') == 2
          assert new.count('audioDiagnosticFailure(error, failClosedOnVehicleNetworkBind)') == 7
          assert 'onSyncPortRefused?.invoke(audioDiagnosticFailure(error, failClosedOnVehicleNetworkBind))' in new
          assert 'if (b233) "vehicle_port=$port" else "$host:$port"' in new
          assert 'if (b233) error.javaClass.simpleName else error.message.orEmpty()' in new
          test = Path('app/src/test/java/io/github/shaonialife/cardeck/audio/AudioVehicleNetworkBindGuardTest.kt').read_text()
          assert 'b233AudioDiagnosticsDoNotExposePeerOrPlatformExceptionText' in test
          assert 'legacyAudioDiagnosticsPreserveOriginalDetail' in test
          print('B233 peer and failure diagnostic redaction, old-code negative control and legacy compatibility verified')
          PY
      - name: Android negative regression, full JUnit, Lint and Debug
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 Draft only: no signing, release, installation or stable merge.
