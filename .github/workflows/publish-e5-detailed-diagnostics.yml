name: E5 detailed diagnostic - signed isolated experiment
# Source-locked single signed raw-log HTTP v2 experimental APK delivery.
# Subsequent pushes cannot pass the exact parent/message/source guards.
# No production latest, recovery APK or extra ZIP. Manual path remains gated.
on:
  push:
    branches: [experiment/buick-e5-detailed-diagnostics]
    paths:
      - '.github/workflows/publish-e5-detailed-diagnostics.yml'
  workflow_dispatch:
concurrency:
  # Serialize signed version allocation with official E5 and other channels.
  group: cardeck-global-signed-release-version
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated source and E5 identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-e5-detailed-diagnostics"
          # Never release a runtime delta relative to the independently green CI source.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git rev-parse HEAD^)" = "649996a27e051b9d3242938dbc01aab547fb4cf6"
            test "$(git log -1 --format=%s)" = "release(e5): unified-http-v2-single-apk"
            test "$(git diff --name-only 649996a27e051b9d3242938dbc01aab547fb4cf6 HEAD)" = ".github/workflows/ci-e5-detailed-diagnostics.yml
.github/workflows/publish-e5-detailed-diagnostics.yml"
            test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44458686268 --jq .conclusion)" = success
            test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/44458686268 --jq .head_sha)" = "649996a27e051b9d3242938dbc01aab547fb4cf6"
            if gh release view "exp-buick-e5-detailed-diagnostics-http-v2-20261119" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Unique logs-v2 experiment already published; refuse repeat"
              exit 1
            fi
          fi
          test "$(git rev-parse origin/Buick-E5)" = "550f30272f3545f76650478788155ba1374fdc5e"
          git merge-base --is-ancestor 550f30272f3545f76650478788155ba1374fdc5e HEAD
          grep -Fq 'applicationId = "io.github.buick.e5.cardeck"' app/build.gradle.kts
          grep -Fq 'private const val RELEASE_TAG = "buick-e5-latest"' app/src/main/java/io/github/shaonialife/cardeck/update/BuickUpdater.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify required Android unit tests without making a second APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint report and changed diagnostic-file error gate
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug
          lint_rc=$?
          set -e
          if (( lint_rc != 0 )); then
            # This E5 base predates the Test Lint baseline. Existing unrelated
            # L3 virtual-display flags can trigger WrongConstant. We must not
            # change Shizuku/display behavior or rewrite its baseline just to
            # ship an isolated L2 updater experiment. Keep full lint visible,
            # but FAIL if any changed updater source has a new error.
            python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          files = sorted(pathlib.Path("app/build/reports").glob("lint-results-debug*.xml"))
          if not files:
              print("::error::Lint failed and no XML report was generated")
              sys.exit(1)
          root = ET.parse(files[-1]).getroot()
          affected = {
              "app/src/main/java/io/github/shaonialife/cardeck/EntryConfigActivity.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/gateway/SystemLogCapture.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayProbe.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/gateway/OfflineDiagnosticExporter.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/gateway/DetailedDiagnosticSelector.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/ui/DiagnosticPreviewDialog.kt",
              "app/src/main/res/layout/activity_entry_config.xml",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/java/io/github/shaonialife/cardeck/gateway/RescueTracePolicy.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/gateway/RescueTraceStore.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/service/RescueTraceService.kt",
          }
          failures = []
          inherited = []
          for issue in root.findall("issue"):
              if issue.get("severity") != "Error":
                  continue
              details = [
                  (loc.get("file") or "").replace("\\", "/")
                  for loc in issue.findall("location")
              ]
              if any(any(f.endswith(path) for path in affected) for f in details):
                  failures.append((issue.get("id"), details))
              else:
                  inherited.append((issue.get("id"), details))
          for item in failures:
              print("::error::Detailed diagnostics source has lint error:", item)
          print(f"Existing unrelated E5 lint errors: {len(inherited)}; new detailed diagnostics errors: {len(failures)}")
          if failures:
              sys.exit(1)
          print("::warning::Full-project lint is NOT clean; unrelated pre-existing errors are documented, not marked as passed")
          PY
          fi
      - name: Restore existing release signing identity
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-diagnostics.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-diagnostics.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-diagnostics.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Allocate globally monotonic version (never reuse failed allocations)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/allocate_version.py
          echo "SOURCE_BRANCH=experiment/buick-e5-detailed-diagnostics" >> "$GITHUB_ENV"
      - name: Build existing-key signed experiment APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify E5 package, signing, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          # Don't pipe aapt to grep -q with pipefail: grep may close early
          # and make aapt exit SIGPIPE even when package ID is correct.
          if ! grep -Fq "package: name='io.github.buick.e5.cardeck'" <<< "$BADGING"; then
            echo "::error::签名包包名不是当前E5安装包"
            exit 1
          fi
          test "$CARDECK_RELEASE_BRANCH" = "$GITHUB_REF_NAME"
          grep -Fq "versionCode='$CARDECK_BUILD_VERSION_CODE'" <<< "$BADGING"
          grep -Fq "versionName='$CARDECK_RELEASE_VERSION_NAME'" <<< "$BADGING"
          "$APKSIGNER" verify "$APK"
          CERT_DETAILS="$("$APKSIGNER" verify --print-certs "$APK")"
          if grep -qi 'CN=Android Debug' <<< "$CERT_DETAILS"; then
            echo "::error::签名为Android Debug，不允许交付"
            exit 1
          fi
          # Fail closed if the experimental APK cannot upgrade the existing
          # official E5 identity without changing the Android signing key.
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' <<< "$CERT_DETAILS" | head -n 1)"
          test -n "$NEW_CERT"
          mkdir -p "$RUNNER_TEMP/e5-official-reference"
          gh release download buick-e5-latest --repo "$GITHUB_REPOSITORY" \
            --pattern CarDeck-Buick-E5.apk --dir "$RUNNER_TEMP/e5-official-reference"
          OLD_APK="$RUNNER_TEMP/e5-official-reference/CarDeck-Buick-E5.apk"
          test -s "$OLD_APK"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" |
            sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' | head -n 1)"
          test -n "$OLD_CERT"
          if [[ "${NEW_CERT,,}" != "${OLD_CERT,,}" ]]; then
            echo "::error::实验APK与现行E5正式APK签名证书不一致"
            exit 1
          fi
          # aapt's default resource dump prints resource names but typically
          # omits the compiled STRING VALUES. Use --values explicitly; the
          # updater reads this value from the APK at runtime.
          if ! AAPT_RES="$("$AAPT" dump --values resources "$APK")"; then
            echo "::error::无法读取 APK 编译资源值，拒绝发布"
            exit 1
          fi
          if ! grep -Fq 'cardeck_installed_build_origin' <<< "$AAPT_RES"; then
            echo "::error::APK内不存在安装来源资源名称，拒绝发布"
            exit 1
          fi
          if ! grep -Fq 'experiment/buick-e5-detailed-diagnostics' <<< "$AAPT_RES"; then
            echo "::error::APK的来源资源值不是当前实验分支，拒绝发布"
            grep 'cardeck_installed_build_origin' <<< "$AAPT_RES" | head -n 3 || true
            exit 1
          fi
          echo "E5包名、Android签名和APK内实验来源资源值校验完成"
          cp "$APK" CarDeck-Buick-E5-Diagnostics.apk
          sha256sum CarDeck-Buick-E5-Diagnostics.apk > CarDeck-Buick-E5-Diagnostics.apk.sha256
      - name: Publish only isolated E5 experiment (never stable latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-e5-detailed-diagnostics"
          test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"
          test "$CARDECK_RELEASE_BRANCH" = "$GITHUB_REF_NAME"
          APK=CarDeck-Buick-E5-Diagnostics.apk
          test -s "$APK" && test -s "$APK.sha256"
          TAG="exp-buick-e5-detailed-diagnostics-$CARDECK_RELEASE_VERSION_NAME"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            TAG="exp-buick-e5-detailed-diagnostics-http-v2-20261119"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists: refusing replace or re-sign"
            exit 1
          fi
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-E5\nsourceBranch=%s\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## 更新说明\n'
            printf '统一日志服务 HTTPS POST /logs/v1/logs/batches，schema_version=2；单行最大12KiB UTF-8、整包最大16KiB、每包最多8行。用户启用后软件日志完全原文上传：不脱敏IP、口令、协议字段、时间戳或其他原文；系统日志仍须主动预览确认。固定 client_id 绑定独立 CarDeck writer Token，旧 WebSocket Token 不会自动迁移；ACK 必须严格匹配版本、批次ID及行数，失败进程内使用同批次重试。重启前本地留存不自动上传。实验未改CarPlay音视频、触控和蓝牙源码。\n'
            printf '\n## 尚未验收\n这是单APK L3实验，不是正式E5；必须先为手机的随机安装client_id单独登记writer身份。原文可能包含敏感信息，请仅在本人受控环境开启。需要验收：新HTTPS v2 ACK与原文回读、断网同ID重发、错误鉴权拒绝、手动系统日志确认及手机现有视频触控A2DP。旧已脱敏历史无法恢复原文。本包可能替换当前安装的其它视频实验逻辑，需停车确认再覆盖；更高versionCode不能直接降级，不要卸载清数据。尚未证实端到端手机/实车通过。\n'
          } > release-notes.txt
          gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "别克 E5 · 统一 HTTPS v2 原文日志 $CARDECK_RELEASE_VERSION_NAME（实验）" \
            --notes-file release-notes.txt --prerelease --latest=false
