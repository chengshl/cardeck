name: 'E5 #33 ACK experiment source and release-chain preflight (no APK)'
on:
  push:
    branches: [experiment/buick-e5-iap2-stale-ack-guard-33]
    paths:
      - '.github/workflows/ci-e5-iap2-33-release-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact #33 candidate, stable baseline and future Chinese label
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-e5-iap2-stale-ack-guard-33"
          git fetch --no-tags origin Buick-E5 work/e5-iap2-stale-ack-guard-33 fix/e5-iap2-stale-ack-chinese-label-33
          test "$(git rev-parse origin/Buick-E5)" = "06cdfdd5b3f58e797e68c57e2a4bc43820d19de0"
          test "$(git rev-parse origin/work/e5-iap2-stale-ack-guard-33)" = "65ea8768d7792855e6bfa8e8b043b22707fba41a"
          git merge-base --is-ancestor origin/work/e5-iap2-stale-ack-guard-33 HEAD
          test "$(git diff --name-only origin/work/e5-iap2-stale-ack-guard-33...HEAD)" = ".github/workflows/ci-e5-iap2-33-release-readiness.yml"
          test "$(git merge-base HEAD origin/Buick-E5)" = "$(git rev-parse origin/Buick-E5)"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = 'experiment/buick-e5-iap2-stale-ack-guard-33'
          label = f'"{source}" -> "iAP2 重连 ACK 防误确认（#33）"'
          catalog = 'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalog.kt'
          planned = subprocess.check_output(['git','show',f'origin/fix/e5-iap2-stale-ack-chinese-label-33:{catalog}'], text=True)
          stable = subprocess.check_output(['git','show',f'origin/Buick-E5:{catalog}'], text=True)
          assert label in planned, 'PR #69 no longer contains exact trusted Chinese mapping'
          assert 'applicationId = "io.github.buick.e5.cardeck"' in Path('app/build.gradle.kts').read_text()
          changed = set(subprocess.check_output(['git','diff','--name-only','origin/Buick-E5...HEAD'],text=True).splitlines())
          allowed = {
            '.github/workflows/ci-e5-iap2-stale-ack-33.yml',
            '.github/workflows/ci-e5-iap2-33-release-readiness.yml',
            'app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2LinkEngine.kt',
            'app/src/test/java/io/github/shaonialife/cardeck/iap2/Iap2LinkEngineTest.kt',
          }
          assert changed == allowed, f'Unexpected release candidate scope: {sorted(changed ^ allowed)}'
          assert 'experiment/buick-e5-iap2-stale-ack-guard-33' == source
          print('Source branch, PR #68 code snapshot, narrow diff and PR #69 Chinese mapping verified')
          if label not in stable:
              print('::notice::BLOCKED: current official E5 APK lacks #33 trusted Chinese label; no signing allowed')
              with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## #33 release readiness: BLOCKED\nCurrent Buick-E5 does not contain the exact #33 Chinese source mapping. PR #69 is only prepared, not installed. **No APK is signed or published.**\n')
          else:
              print('Stable source contains mapping; installed APK still requires independent confirmation')
          PY
      - name: Verify published E5 version chain and signed asset presence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          repo = 'chengshl/cardeck'
          tags = [
            'buick-e5-latest',
            'exp-buick-e5-video-firstframe-observability-EXP--OBSERVABILITY-96375CDB4EA9-261029015',
            'e5-stable-restore-after-video-observation-v2-20261029',
          ]
          codes = []
          for tag in tags:
              release = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/{tag}'],text=True))
              body = dict(line.split('=',1) for line in release['body'].splitlines() if '=' in line and not line.startswith('#'))
              code = int(body['versionCode'])
              assets = [x['name'] for x in release['assets']]
              assert any(x.endswith('.apk') for x in assets), (tag, assets)
              assert any(x.endswith('.apk.sha256') for x in assets), (tag, assets)
              codes.append(code)
          assert codes[0] == 89204263 and codes[1] == 89204507 and codes[2] == 89204866, codes
          assert codes[0] < codes[1] < codes[2], codes
          print('Published 014 -> 015 -> 016: release metadata, APK and SHA256 asset presence verified')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'\nPrior signed E5 chain: {codes[0]} → {codes[1]} → {codes[2]}. Future #33 chain requires **new official > {codes[2]} → #33 experiment > official → data-preserving recovery > experiment → subsequent official > recovery**. Source/asset checks are not signing-certificate or device validation.\n')
          PY
      - name: Verify real 014/015/016 APK SHA256, applicationId, versionCode and signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          cert_first=""
          while IFS='|' read -r tag apk code origin; do
            mkdir -p "$RUNNER_TEMP/e5-chain/$code"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$apk" --pattern "$apk.sha256" --dir "$RUNNER_TEMP/e5-chain/$code"
            (
              cd "$RUNNER_TEMP/e5-chain/$code"
              sha256sum --check "$apk.sha256"
            )
            badging="$("$AAPT" dump badging "$RUNNER_TEMP/e5-chain/$code/$apk")"
            grep -Fq "package: name='io.github.buick.e5.cardeck'" <<< "$badging"
            grep -Fq "versionCode='$code'" <<< "$badging"
            resources="$("$AAPT" dump --values resources "$RUNNER_TEMP/e5-chain/$code/$apk")"
            grep -Fq 'cardeck_installed_build_origin' <<< "$resources"
            grep -Fq "$origin" <<< "$resources"
            "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/e5-chain/$code/$apk" > "$RUNNER_TEMP/e5-chain/$code/cert.txt"
            if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/e5-chain/$code/cert.txt"; then
              echo "::error::Debug certificate in signed E5 chain"; exit 1
            fi
            cert="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/e5-chain/$code/cert.txt" | head -n 1)"
            [[ "$cert" =~ ^[[:xdigit:]]{64}$ ]]
            if [[ -z "$cert_first" ]]; then cert_first="$cert"; else
              test "${cert,,}" = "${cert_first,,}"
            fi
          done <<'E5_CHAIN'
          buick-e5-latest|CarDeck-Buick-E5.apk|89204263|Buick-E5
          exp-buick-e5-video-firstframe-observability-EXP--OBSERVABILITY-96375CDB4EA9-261029015|CarDeck-Buick-E5-Video-Observation.apk|89204507|experiment/buick-e5-video-firstframe-observability
          e5-stable-restore-after-video-observation-v2-20261029|CarDeck-Buick-E5-Stable-Restore.apk|89204866|Buick-E5
          E5_CHAIN
          echo "Three actual E5 APKs: checksum, same package, code, source and production signing certificate verified"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run #33 regression tests and Debug build (never sign)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check modified Android source for Lint errors (inherited debt disclosed)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:lintDebug --stacktrace > "$RUNNER_TEMP/e5-33-lint.log" 2>&1
          lint_rc=$?
          set -e
          if (( lint_rc != 0 )); then
            python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = sorted(Path('app/build/reports').glob('lint-results-debug*.xml'))
          if not reports:
              raise SystemExit('Lint failed without XML report')
          issues = [x for x in ET.parse(reports[-1]).getroot().findall('issue') if x.get('severity','').lower() in ('error','fatal')]
          changed = ('Iap2LinkEngine.kt',)
          new = [x.get('id') for x in issues if any((loc.get('file') or '').endswith(changed) for loc in x.findall('location'))]
          print(f'Inherited/unrelated Lint errors: {len(issues)-len(new)}; changed-source errors: {len(new)}')
          if new:
              raise SystemExit(f'Changed source Lint errors: {new}')
          print('::warning::Full project Lint has inherited errors; this is NOT a full-Lint pass')
          PY
          fi
