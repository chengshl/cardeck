name: B233 RTSP unmatched RTSP log privacy isolation (test only)

on:
  pull_request:
    branches:
      - experiment/buick-test-t89-pcm-reverse-rtcp
    paths:
      - '.github/workflows/ci-b233-rtsp-unmatched-log-privacy.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidence.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidenceTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b233-unmatched-log-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact signed T89 base, four-file scope and B233-only wiring
        shell: bash
        run: |
          set -euo pipefail
          BASE=06255735f4ca7a2106fd69b5d4953ecb56cf325c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/b233-head-scope
          test "$(wc -l < /tmp/b233-head-scope)" -eq 4
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci-b233-rtsp-unmatched-log-privacy.yml|app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt|app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidence.kt|app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidenceTest.kt) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done < /tmp/b233-head-scope
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay')
          src = (root / 'AirPlayClient.kt').read_text()
          helper = (root / 'RtspPeerRequestEvidence.kt').read_text()
          test = Path('app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidenceTest.kt').read_text()
          dispatch = src.split('    private fun dispatchResponse(', 1)[1].split('    /** 无匹配报文计数', 1)[0]
          assert 'if (endpoint.isBuickB233) RtspPeerRequestEvidence.safeUnmatchedStartLine(statusLine)' in dispatch
          assert 'else statusLine' in dispatch
          assert '[$diagnosticStartLine] cseq=' in dispatch
          assert '[$statusLine] cseq=' not in dispatch
          assert 'if (message.isRequest)' in dispatch
          assert 'queue.offer(message.statusLine to message.body)' in dispatch
          assert 'fun safeUnmatchedStartLine(startLine: String): String' in helper
          assert 'peer_request=TEARDOWN' in helper
          assert 'peer_request=OTHER' in helper
          assert 'response_status=$code' in helper
          for name in ('unmatchedB233PeerRequestNeverEchoesSensitiveUri',
                       'unmatchedB233ResponsePreservesOnlyValidatedStatusCode',
                       'malformedOrInjectedStartLinesDoNotEnterDiagnostics'):
              assert name in test, name
          print('B233 only: unmatched RTSP logs omit URI, reason phrase, malformed raw lines')
          PY
      - name: B233 RTSP unmatched log privacy regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.RtspPeerRequestEvidenceTest --stacktrace
      - name: Full Android JUnit, Lint and Debug compile
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# No signing, release, stable merge or vehicle acceptance from this workflow.
