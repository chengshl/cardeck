name: E5 BT-A B233 profile preserve - manual guarded signing (#24)
# This L3 draft remains manual-only until an installable, data-preserving
# recovery path and device acceptance plan are approved. Source changes alone
# must never mint a higher-version APK.
on:
  workflow_dispatch:
concurrency:
  # Serialize signed version allocation with official E5 and other channels.
  group: cardeck-global-signed-release-version
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated source and E5 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/e5-bt-a-profile-preserve-24-20261030"
          grep -Fq 'applicationId = "io.github.buick.e5.cardeck"' app/build.gradle.kts
          grep -Fq 'private const val RELEASE_TAG = "buick-e5-latest"' app/src/main/java/io/github/shaonialife/cardeck/update/BuickUpdater.kt
          grep -Fq 'BuickB233Route.shouldProtectProfiles(' app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt
          grep -Fq 'BUICK_[0-9]{4}' app/src/main/java/io/github/shaonialife/cardeck/bt/BuickB233Route.kt
          python3 -m unittest tools.release.test_allocate_version
          test "$(git rev-parse origin/Buick-E5)" = "5e565a08b228d157ff1d739f38b8c09fad80f8a5"
          # #93 added only review fixtures and a CI workflow; never accept runtime drift.
          test "$(git diff --name-only 6dff31cac9a4a6f1945b787ba01eea577761d0eb 5e565a08b228d157ff1d739f38b8c09fad80f8a5 | sort)" = "$(printf '%s\n' \
            .github/workflows/ci-e5-test-migration-parser-diagnostics-27.yml \
            app/src/test/java/io/github/shaonialife/cardeck/airplay/BplistExtendedLengthTest.kt \
            app/src/test/java/io/github/shaonialife/cardeck/gateway/DiagnosticPreviewSummaryTest.kt | sort)"
          python3 - <<'PY'
          import subprocess
          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/Buick-E5...HEAD'], text=True
          ).splitlines())
          assert files == {
              '.github/workflows/ci-e5-bt-a-profile-preserve-24.yml',
              '.github/workflows/publish-e5-bt-a-profile-preserve-24.yml',
              'app/src/main/java/io/github/shaonialife/cardeck/bt/BuickB233Route.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/bt/BuickB233ProfilePreserveTest.kt',
          }, 'Unreviewed BT-A signing source scope: ' + str(files)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify all Android tests and debug build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Lint report and changed diagnostic-file error gate
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug
          lint_rc=$?
          set -e
          if (( lint_rc != 0 )); then
            # This E5 base predates the Test Lint baseline. Existing unrelated
            # L3 virtual-display flags can trigger WrongConstant. We must not
            # change Shizuku/display behavior or rewrite its baseline just to
            # ship an isolated L2 updater experiment. Keep full lint visible,
            # but FAIL if any changed updater source has a new error.
            python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          files = sorted(pathlib.Path("app/build/reports").glob("lint-results-debug*.xml"))
          if not files:
              print("::error::Lint failed and no XML report was generated")
              sys.exit(1)
          root = ET.parse(files[-1]).getroot()
          affected = {
              "app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt",
              "app/src/main/java/io/github/shaonialife/cardeck/bt/BuickB233Route.kt",
              "app/src/test/java/io/github/shaonialife/cardeck/bt/BuickB233ProfilePreserveTest.kt",
          }
          failures = []
          inherited = []
          for issue in root.findall("issue"):
              if issue.get("severity") != "Error":
                  continue
              details = [
                  (loc.get("file") or "").replace("\\", "/")
                  for loc in issue.findall("location")
              ]
              if any(any(f.endswith(path) for path in affected) for f in details):
                  failures.append((issue.get("id"), details))
              else:
                  inherited.append((issue.get("id"), details))
          for item in failures:
              print("::error::BT-A source has lint error:", item)
          print(f"Existing unrelated E5 lint errors: {len(inherited)}; new BT-A errors: {len(failures)}")
          if failures:
              sys.exit(1)
          print("::warning::Full-project lint is NOT clean; unrelated pre-existing errors are documented, not marked as passed")
          PY
          fi
      - name: Restore existing release signing identity
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-diagnostics.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-diagnostics.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-diagnostics.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Allocate globally monotonic version (never reuse failed allocations)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/allocate_version.py
          echo "SOURCE_BRANCH=work/e5-bt-a-profile-preserve-24-20261030" >> "$GITHUB_ENV"
      - name: Build existing-key signed experiment APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify E5 package, signing, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          # Don't pipe aapt to grep -q with pipefail: grep may close early
          # and make aapt exit SIGPIPE even when package ID is correct.
          if ! grep -Fq "package: name='io.github.buick.e5.cardeck'" <<< "$BADGING"; then
            echo "::error::签名包包名不是当前E5安装包"
            exit 1
          fi
          test "$CARDECK_RELEASE_BRANCH" = "$GITHUB_REF_NAME"
          grep -Fq "versionCode='$CARDECK_BUILD_VERSION_CODE'" <<< "$BADGING"
          grep -Fq "versionName='$CARDECK_RELEASE_VERSION_NAME'" <<< "$BADGING"
          "$APKSIGNER" verify "$APK"
          CERT_DETAILS="$("$APKSIGNER" verify --print-certs "$APK")"
          if grep -qi 'CN=Android Debug' <<< "$CERT_DETAILS"; then
            echo "::error::签名为Android Debug，不允许交付"
            exit 1
          fi
          # Fail closed if the experimental APK cannot upgrade the existing
          # official E5 identity without changing the Android signing key.
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' <<< "$CERT_DETAILS" | head -n 1)"
          test -n "$NEW_CERT"
          mkdir -p "$RUNNER_TEMP/e5-official-reference"
          gh release download buick-e5-latest --repo "$GITHUB_REPOSITORY" \
            --pattern CarDeck-Buick-E5.apk --dir "$RUNNER_TEMP/e5-official-reference"
          OLD_APK="$RUNNER_TEMP/e5-official-reference/CarDeck-Buick-E5.apk"
          test -s "$OLD_APK"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" |
            sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' | head -n 1)"
          test -n "$OLD_CERT"
          if [[ "${NEW_CERT,,}" != "${OLD_CERT,,}" ]]; then
            echo "::error::实验APK与现行E5正式APK签名证书不一致"
            exit 1
          fi
          # aapt's default resource dump prints resource names but typically
          # omits the compiled STRING VALUES. Use --values explicitly; the
          # updater reads this value from the APK at runtime.
          if ! AAPT_RES="$("$AAPT" dump --values resources "$APK")"; then
            echo "::error::无法读取 APK 编译资源值，拒绝发布"
            exit 1
          fi
          if ! grep -Fq 'cardeck_installed_build_origin' <<< "$AAPT_RES"; then
            echo "::error::APK内不存在安装来源资源名称，拒绝发布"
            exit 1
          fi
          if ! grep -Fq 'work/e5-bt-a-profile-preserve-24-20261030' <<< "$AAPT_RES"; then
            echo "::error::APK的来源资源值不是当前实验分支，拒绝发布"
            grep 'cardeck_installed_build_origin' <<< "$AAPT_RES" | head -n 3 || true
            exit 1
          fi
          echo "E5包名、Android签名和APK内实验来源资源值校验完成"
          cp "$APK" CarDeck-Buick-E5-BT-A-Profile-Preserve.apk
          sha256sum CarDeck-Buick-E5-BT-A-Profile-Preserve.apk > CarDeck-Buick-E5-BT-A-Profile-Preserve.apk.sha256
      - name: Publish only isolated E5 experiment (never stable latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/e5-bt-a-profile-preserve-24-20261030"
          test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"
          test "$CARDECK_RELEASE_BRANCH" = "$GITHUB_REF_NAME"
          APK=CarDeck-Buick-E5-BT-A-Profile-Preserve.apk
          test -s "$APK" && test -s "$APK.sha256"
          TAG="exp-buick-e5-bt-a-profile-preserve-24-$CARDECK_RELEASE_VERSION_NAME"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-E5\nsourceBranch=%s\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## 更新说明\n'
            printf 'E5 BT-A（#24）仅保护已识别的 B233 候选：跳过主动 BtProfiles.disconnect 以保留 HFP/A2DP/LE。维持原 iAP2/ACK、AirPlay音源声明、视频触控及重试策略。不代表 #24 整体音源、#33 ACK109 或 #28 零帧已修复。PR#74。\n'
            printf '\n## 尚未验收\n本实验APK不是正式E5；需手机检查：Shizuku授权、常驻通知、持续采集运行超过4小时不主动停止、手动停止和离线导出、2MB上限/脱敏、异常后留存、E5视频触控A2DP及普通/详细日志上传ACK均正常。升级将保留已存应用数据但替换运行程序，建议先导出旧取证文件；同包更高versionCode无法无损降级，不要卸载来回退。\n'
          } > release-notes.txt
          gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-E5 BT-A B233 蓝牙配置文件保护 $CARDECK_RELEASE_VERSION_NAME（实验）" \
            --notes-file release-notes.txt --prerelease --latest=false
