name: Rust 协议分支单 APK 实验构建

on:
  push:
    branches: [rust-protocol-bridge]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-protocol-bridge-single-apk
  cancel-in-progress: false

jobs:
  signed-experiment:
    if: github.repository == 'chengshl/cardeck' && github.ref == 'refs/heads/rust-protocol-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出新分支
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: 恢复本仓库签名（绝不回退 Debug）
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::本仓库 CARDECK_* 签名参数不完整"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-upload.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-upload.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/cardeck-upload.p12"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 构建唯一标准版 APK
        shell: bash
        run: |
          set -euo pipefail
          # 本轮只允许从指定上游快照衍生的源码生成实验包。
          UPSTREAM_SHA=3599f3d6e0c60d9335df6e9a56cba70e784e78b1
          git cat-file -e "$UPSTREAM_SHA^{commit}"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD || {
            echo "::error::当前实验分支不是预期上游 Rust 快照的后代"
            exit 1
          }
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease "-Pcardeck.buildNumber=$GITHUB_RUN_NUMBER" --stacktrace
      - name: 验证唯一产物、安装身份及正式签名
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/standard/release/app-standard-release.apk"
          test -s "$APK"
          APK_COUNT=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          test "$APK_COUNT" -eq 1 || { echo "::error::只能生成一个 APK，实际 $APK_COUNT"; exit 1; }
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n1)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$AAPT" && test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK")
          grep -Fq "package: name='io.github.shaonialife.cardeck'" <<< "$BADGING"
          VERSION="0.1.29.$GITHUB_RUN_NUMBER"
          grep -Fq "versionName='$VERSION'" <<< "$BADGING"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apk-cert.txt"; then
            echo "::error::拒绝 Debug 签名 APK"
            exit 1
          fi
          CERT=$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/apk-cert.txt" | head -n1)
          test -n "$CERT"
          cp "$APK" CarDeck-Rust-Protocol-Bridge.apk
          sha256sum CarDeck-Rust-Protocol-Bridge.apk > CarDeck-Rust-Protocol-Bridge.apk.sha256
          {
            echo "APK_VERSION=$VERSION"
            echo "APK_CERT=$CERT"
          } >> "$GITHUB_ENV"
          {
            echo "### Rust 协议实验版"
            echo "上游 SHA：3599f3d6e0c60d9335df6e9a56cba70e784e78b1"
            echo "构建 SHA：$GITHUB_SHA"
            echo "版本：$VERSION"
            echo "签名证书 SHA-256：$CERT"
            echo "APK SHA-256：$(cut -d ' ' -f1 CarDeck-Rust-Protocol-Bridge.apk.sha256)"
            echo "应用包名：io.github.shaonialife.cardeck，与 Buick-E5 独立"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 发布唯一签名实验 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="exp-rust-protocol-bridge-$GITHUB_RUN_ID"
          {
            echo "artifactKind=experiment"
            echo "sourceBranch=rust-protocol-bridge"
            echo "sourceCommit=$GITHUB_SHA"
            echo "upstreamCommit=3599f3d6e0c60d9335df6e9a56cba70e784e78b1"
            echo "versionName=$APK_VERSION"
            echo "applicationId=io.github.shaonialife.cardeck"
            echo "certificateSHA256=$APK_CERT"
            echo ""
            echo "## 更新说明"
            echo "- 从上游 Rust 分支建立实验包，复用 chengshl/cardeck CARDECK_* 签名。"
            echo "- 只生成一个 standardRelease APK，不覆盖 Buick、E5 或正式 latest。"
            echo "- 尚未通过别克 E5 B233 实车验证。"
          } > release-notes.txt
          gh release create "$TAG" CarDeck-Rust-Protocol-Bridge.apk CarDeck-Rust-Protocol-Bridge.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CarDeck Rust 协议实验版 $APK_VERSION" \
            --notes-file release-notes.txt --prerelease --latest=false
      - name: 适用单测与 Lint（只记录，不重复打包）
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testStandardDebugUnitTest :app:lintStandardRelease --stacktrace
