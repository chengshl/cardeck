name: Verify isolated Buick T74 experiment

on:
  push:
    branches:
      - 'experiment/buick-test-t74-network-guard'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Kotlin formatting
        run: ./gradlew spotlessCheck --stacktrace
      - name: Compile debug APK (never publish or replace Buick-Test)
        run: ./gradlew :app:assembleDebug --stacktrace
