name: Verify isolated Buick T74 experiment

on:
  push:
    branches:
      - 'experiment/buick-test-t74-network-guard'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Patch whitespace (repository has pre-existing Spotless violations)
        run: |
          git diff --check HEAD~1 HEAD
          echo "Repository-wide Spotless intentionally not a T74 gate: 85+ unrelated baseline files fail."
      - name: Compile debug APK (never publish or replace Buick-Test)
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Restore existing Buick-Test signing key (no debug fallback)
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing existing signing secrets; no unsigned/debug replacement will be released"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t74.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t74.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t74.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Assign isolated experiment version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          echo "CARDECK_BUILD_VERSION_CODE=$((BUILD_EPOCH - 1704067200))" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: Build signed T74 release APK (artifact only)
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify isolated package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='io.github.buick.test.cardeck'"
          "$APKSIGNER" verify "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi 'CN=Android Debug'; then
            echo "::error::Refusing to upload debug-signed APK"
            exit 1
          fi
          cp "$APK" CarDeck-Buick-Test-T74-Experiment.apk
          sha256sum CarDeck-Buick-Test-T74-Experiment.apk > CarDeck-Buick-Test-T74-Experiment.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T74-Experiment-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T74-Experiment.apk
            CarDeck-Buick-Test-T74-Experiment.apk.sha256
          if-no-files-found: error
