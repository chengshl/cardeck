name: Build and publish latest CarDeck APK (all branches)

on:
  workflow_call:

jobs:
  signed-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore shared APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing shared CarDeck APK signing secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-upload.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-upload.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-upload.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Run Android unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assign monotonic cross-branch Android version
        shell: bash
        run: |
          set -euo pipefail
          # Global time-based versionCode, identical formula across all three
          # branches. Workflows share one concurrency group, so the next build
          # starts after the prior one publishes. 2024-01-01 UTC = code epoch.
          CODE=$(( $(date -u +%s) - 1704067200 ))
          if (( CODE < 300000 || CODE > 2100000000 )); then
            echo "::error::Computed Android versionCode out of range: $CODE"
            exit 1
          fi
          echo "CARDECK_BUILD_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "Unified versionCode=$CODE branch=$GITHUB_REF_NAME"
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CarDeck-${{ github.ref_name }}-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish unified release and legacy updater aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/*.apk CarDeck-latest.apk
          printf 'versionCode=%s\nbranch=%s\ncommit=%s\nbuiltAt=%s\n\nLatest successfully built CarDeck APK across main, Buick-main and Buick-E5.\n' \
            "$CARDECK_BUILD_VERSION_CODE" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > release-notes.txt

          # Never let an older code replace a newer shared APK.
          PREVIOUS_CODE="$(gh release view cardeck-latest --json body --jq '.body' 2>/dev/null \
            | sed -n 's/^versionCode=//p' | head -n 1 || true)"
          if [[ "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] && (( CARDECK_BUILD_VERSION_CODE <= PREVIOUS_CODE )); then
            echo "Shared release $PREVIOUS_CODE already newer; do not overwrite"
            exit 0
          fi

          # Main updater uses cardeck-latest. Mirror both old tags so apps
          # installed before this change immediately see the shared latest.
          for TAG in cardeck-latest buick-e5-latest buick-main-latest; do
            case "$TAG" in
              cardeck-latest) APK="CarDeck-latest.apk" ;;
              buick-e5-latest) APK="CarDeck-Buick-E5.apk" ;;
              buick-main-latest) APK="CarDeck-Buick-main.apk" ;;
            esac
            if [[ "$APK" != "CarDeck-latest.apk" ]]; then cp CarDeck-latest.apk "$APK"; fi
            sha256sum "$APK" > "$APK.sha256"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
              gh release edit "$TAG" --title "CarDeck shared latest - $GITHUB_REF_NAME" \
                --notes-file release-notes.txt --prerelease
            else
              gh release create "$TAG" "$APK" "$APK.sha256" \
                --target "$GITHUB_SHA" --title "CarDeck shared latest - $GITHUB_REF_NAME" \
                --notes-file release-notes.txt --prerelease
            fi
            echo "Updated $TAG with branch=$GITHUB_REF_NAME versionCode=$CARDECK_BUILD_VERSION_CODE"
          done
