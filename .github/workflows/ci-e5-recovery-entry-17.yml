name: E5 #17 exact-source recovery entry (L2 isolated)
on:
  push:
    branches: [experiment/buick-e5-recovery-entry-17]
  pull_request:
    branches: [Buick-E5]
    paths:
      - 'app/src/main/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicy.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicyTest.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt'
      - '.github/workflows/ci-e5-recovery-entry-17.yml'
permissions:
  contents: read
jobs:
  e5-recovery-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify precise stable baseline and changed-file scope
        run: |
          set -euo pipefail
          git fetch origin Buick-E5
          test "$(git rev-parse origin/Buick-E5)" = '7945c16254e71c12f2824c7d90e4de960649f6f0'
          python3 - <<'PY'
          import subprocess
          allowed = {
              'app/src/main/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicy.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicyTest.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt',
              '.github/workflows/ci-e5-recovery-entry-17.yml',
              '.github/workflows/ci-e5-chinese-project-labels.yml',
          }
          changed = set(subprocess.check_output(
              ['git','diff','--name-only','origin/Buick-E5...HEAD'], text=True
          ).splitlines())
          assert changed and changed.issubset(allowed), sorted(changed - allowed)
          assert len(changed) == len(allowed), sorted(allowed - changed)
          print('Isolated recovery diff:', sorted(changed))
          PY
      - name: Android JUnit and Debug build (no signing or release)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Full Lint report; no errors on touched files
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:lintDebug --stacktrace > e5-recovery-lint.txt 2>&1
          EXIT=$?
          set -e
          if (( EXIT != 0 )); then grep -E 'Lint found|First failure:' e5-recovery-lint.txt | head -n 8 || true; fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('app/build/reports/lint-results-debug.xml')
          assert report.is_file(), 'Lint XML missing; fail closed'
          touched = {
              'app/src/main/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicy.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicyTest.kt',
          }
          issues = []
          for issue in ET.parse(report).getroot().findall('.//issue'):
              if issue.get('severity', '').lower() not in ('error', 'fatal'): continue
              loc = issue.find('location')
              path = (loc.get('file','') if loc is not None else '').replace('\\','/')
              if '/app/' in path: path = 'app/' + path.split('/app/',1)[1]
              issues.append((issue.get('id'),path))
          bad = [x for x in issues if x[1] in touched]
          print(f'Full Lint existing errors: {len(issues)}; touched-file errors: {len(bad)}')
          assert not bad, bad
          PY
      - name: Recovery safety preflight assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/io/github/shaonialife/cardeck')
          policy = (root/'update/E5RecoveryPolicy.kt').read_text()
          updater = (root/'update/ExperimentalUpdates.kt').read_text()
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicyTest.kt').read_text()
          assert 'field("recoveryFor") != installedRelease.tag' in policy
          assert 'field("artifactKind") != "recovery"' in policy
          assert 'field("stableRuntimeCommit") != STABLE_RUNTIME' in policy
          assert 'field("sourceBranch") != RECOVERY_SOURCE' in policy
          assert 'code <= installedCode' in policy
          assert 'matchingSigningCertificates(activity, target)' in updater
          assert 'matchingSigningCertificates(activity, apk)' in updater
          assert 'archiveVersion > installedCode' in updater
          assert 'archive.versionName == candidate.versionName' in updater
          assert 'archive?.versionName != recoveryName' in updater
          assert 'SessionController.disconnect(activity.applicationContext)' in updater
          assert 'refusesAmbiguousExperimentMetadataAndUntrustedStableRuntime' in tests
          assert 'rejectsWrongRecoveryForAndCrossExperimentSource' in tests
          assert 'rejectsForgedAssetUrlsAndMissingChecksum' in tests
          assert 'recovery = txt("恢复当前 #33 实验为稳定代码（保留数据）"' in (root/'UpdateCenterActivity.kt').read_text()
          PY
