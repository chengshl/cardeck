name: Build Buick E5 signed APK
on:
  workflow_dispatch:
  push:
    branches: [Buick-E5]
concurrency:
  group: buick-e5-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Configure CARDECK_KEYSTORE_BASE64, CARDECK_KEYSTORE_PASSWORD and CARDECK_KEY_ALIAS in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-upload.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-upload.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-upload.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Build release APK
        env:
          CARDECK_BUILD_VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CarDeck-Buick-E5
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish Buick E5 in-app update
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/*.apk CarDeck-Buick-E5.apk
          sha256sum CarDeck-Buick-E5.apk > CarDeck-Buick-E5.apk.sha256
          CODE=$((100000 + BUILD_NUMBER))
          printf 'versionCode=%s\nbranch=Buick-E5\ncommit=%s\n' "$CODE" "$GITHUB_SHA" > release-notes.txt
          if gh release view buick-e5-latest >/dev/null 2>&1; then
            gh release upload buick-e5-latest CarDeck-Buick-E5.apk CarDeck-Buick-E5.apk.sha256 --clobber
            gh release edit buick-e5-latest --notes-file release-notes.txt --prerelease
          else
            gh release create buick-e5-latest CarDeck-Buick-E5.apk CarDeck-Buick-E5.apk.sha256 \
              --target "$GITHUB_SHA" --title "CarDeck Buick E5 testing channel" \
              --notes-file release-notes.txt --prerelease
          fi
