name: Build Buick-E5 and publish isolated update

on:
  workflow_dispatch:
  push:
    branches: [Buick-E5]
    # Auto-release only when APK runtime/build inputs change. Changes limited to
    # docs, JVM tests, lint baselines or CI/workflows must not mint new official
    # versionCodes and invalidate previously published experimental/recovery APKs.
    # A deliberate manual official build remains available via workflow_dispatch.
    paths:
      - 'app/src/main/**'
      - 'app/src/release/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

concurrency:
  group: cardeck-global-signed-release-version
  cancel-in-progress: false

jobs:
  signed-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated branch release destination
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Buick-E5"
          grep -Fq 'private const val RELEASE_TAG = "buick-e5-latest"' app/src/main/java/io/github/shaonialife/cardeck/update/BuickUpdater.kt
          grep -Fq 'private const val SOURCE_BRANCH = "Buick-E5"' app/src/main/java/io/github/shaonialife/cardeck/update/BuickUpdater.kt
          grep -Fq 'private const val APK_NAME = "CarDeck-Buick-E5.apk"' app/src/main/java/io/github/shaonialife/cardeck/update/BuickUpdater.kt
          printf 'RELEASE_TAG=%s\nAPK_NAME=%s\n' "buick-e5-latest" "CarDeck-Buick-E5.apk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing APK signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing CarDeck APK signing secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-upload.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-upload.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-upload.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Verify E5 Gateway diagnostic tests (required)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*EntryAddressTest' --tests '*GatewayProbeTest' --tests '*GatewayLogBufferVehicleTest' --tests '*LogRedactorTest' --stacktrace
      - name: Verify E5 Gateway and MCP server tests (required)
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/gateway/requirements.txt
          python3 tools/mcp/test_server.py
          python3 tools/gateway/test_log_archive.py
          python3 tools/gateway/test_gateway.py
      - name: Run all Android unit tests (required)
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Assign global daily version number
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/allocate_version.py
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify APK package ID, visible app label and entry components
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "package: name='io.github.buick.e5.cardeck'" <<< "$BADGING"
          grep -Fq "application-label:'CarDeck-Buick-E5'" <<< "$BADGING"
          # Validate the real APK rather than assuming Gradle got the env variables.
          test "$CARDECK_RELEASE_BRANCH" = "Buick-E5"
          grep -Fq "versionCode='$CARDECK_BUILD_VERSION_CODE'" <<< "$BADGING"
          grep -Fq "versionName='$CARDECK_RELEASE_VERSION_NAME'" <<< "$BADGING"
          MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          grep -Fq 'io.github.shaonialife.cardeck.SenderApp' <<< "$MANIFEST"
          grep -Fq 'io.github.shaonialife.cardeck.MainActivity' <<< "$MANIFEST"
          grep -Fq 'io.github.shaonialife.cardeck.EntryConfigActivity' <<< "$MANIFEST"
          grep -Fq 'io.github.shaonialife.cardeck.service.GatewayLogService' <<< "$MANIFEST"
          echo "Verified independent APK identity: Buick-E5"
      - name: Verify E5 production certificate against previously published signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/e5-new-certificate.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/e5-new-certificate.txt"; then
            echo "::error::Refusing an Android Debug certificate for E5 official release"
            exit 1
          fi
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/e5-new-certificate.txt" | head -n 1)"
          test -n "$NEW_CERT" || { echo "::error::Unable to parse signed E5 certificate"; exit 1; }

          # E5 has an existing official release. Missing history is an error, not
          # permission to silently change the signing key or install identity.
          mkdir -p "$RUNNER_TEMP/e5-previous-official"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_NAME" --dir "$RUNNER_TEMP/e5-previous-official"
          OLD_APK="$RUNNER_TEMP/e5-previous-official/$APK_NAME"
          test -s "$OLD_APK"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" > "$RUNNER_TEMP/e5-previous-certificate.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/e5-previous-certificate.txt" | head -n 1)"
          test -n "$OLD_CERT" || { echo "::error::Unable to parse previous E5 certificate"; exit 1; }
          if [[ "${NEW_CERT,,}" != "${OLD_CERT,,}" ]]; then
            echo "::error::E5 production signing certificate differs from the existing APK; refusing release"
            exit 1
          fi
          echo "E5 APK version and signing certificate preflight passed"
      - uses: actions/upload-artifact@v4
        with:
          name: CarDeck-${{ github.ref_name }}-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish only Buick-E5 update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "Buick-E5"
          test "$RELEASE_TAG" = "buick-e5-latest"
          test "$APK_NAME" = "CarDeck-Buick-E5.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

          COMMIT_NOTES="$(git log -1 --pretty=%B | awk '
            /^CarDeck-Notes:$/ { in_notes=1; next }
            in_notes && NF > 0 { print }
          ')"
          if [[ -z "$COMMIT_NOTES" ]]; then
            COMMIT_NOTES="$(printf '%s\n%s' '- 本次更新包含稳定性与功能维护，具体变更请查看项目发布记录。' '- 若已安装当前版本，可无需重复升级。')"
          fi
          {
            printf 'versionName=%s\nversionCode=%s\nbranch=%s\ncommit=%s\nbuiltAt=%s\ntimezone=Asia/Shanghai\n' \
              "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)"
            printf '\n## 更新说明\n%s\n' "$COMMIT_NOTES"
          } > release-notes.txt

          PREVIOUS_CODE="$(gh release view "$RELEASE_TAG" --json body --jq '.body' 2>/dev/null \
            | sed -n 's/^versionCode=//p' | head -n 1 || true)"
          PREVIOUS_BRANCH="$(gh release view "$RELEASE_TAG" --json body --jq '.body' 2>/dev/null \
            | sed -n 's/^branch=//p' | head -n 1 || true)"
          if [[ "$PREVIOUS_BRANCH" == "$GITHUB_REF_NAME" && "$PREVIOUS_CODE" =~ ^[0-9]+$ ]] && (( CARDECK_BUILD_VERSION_CODE <= PREVIOUS_CODE )); then
            echo "Branch release already newer; keeping existing APK"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "CarDeck Buick-E5 $CARDECK_RELEASE_VERSION_NAME" \
              --notes-file release-notes.txt --prerelease --latest=false
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --target "$GITHUB_SHA" \
              --title "CarDeck Buick-E5 $CARDECK_RELEASE_VERSION_NAME" \
              --notes-file release-notes.txt --prerelease --latest=false
          fi
          echo "Published isolated $GITHUB_REF_NAME -> $RELEASE_TAG / $APK_NAME"
