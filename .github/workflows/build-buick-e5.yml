name: Build Buick-E5 and publish shared CarDeck latest

on:
  workflow_dispatch:
  push:
    branches: [Buick-E5]

# E5's two legacy iAP2 mock tests remain visible as warnings in the shared
# builder; this wrapper intentionally leaves real-car protocol code unchanged.
concurrency:
  group: cardeck-all-branches-latest
  cancel-in-progress: false

jobs:
  shared-build:
    if: github.ref == 'refs/heads/Buick-E5'
    permissions:
      contents: write
    uses: chengshl/cardeck/.github/workflows/build-shared-latest.yml@main
    secrets: inherit
