name: B233 RTSP socket lifecycle isolation (test only)

on:
  # One authoritative Android CI for the PR; avoid duplicate push+PR builds.
  pull_request:
    branches:
      - experiment/buick-test-t89-pcm-reverse-rtcp
    paths:
      - '.github/workflows/ci-b233-rtsp-socket-lifecycle.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycle.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded, still-running validation after a newer commit to this PR.
# Never apply this policy to signing or release workflows.
concurrency:
  group: rtsp-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Lock to signed T89 base and four isolated files
        shell: bash
        run: |
          set -euo pipefail
          BASE=06255735f4ca7a2106fd69b5d4953ecb56cf325c
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/rtsp-scope
          test "$(wc -l < /tmp/rtsp-scope)" -eq 4
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci-b233-rtsp-socket-lifecycle.yml|app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt|app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycle.kt|app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt) ;;
              *) echo "Out-of-scope runtime change: $file"; exit 1 ;;
            esac
          done < /tmp/rtsp-scope
          grep -Fq 'socketLifecycle.retire {' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'socketLifecycle.tryPublish(connectEpoch)' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'closeDuringConnectRejectsLatePublication' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'staleEpochNeverExecutesPublicationCallback' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'retireReaderAndCipherBeforeAllowingNextSocketPublication' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'supersededReaderCannotRouteLateResponseToNewPendingRequest' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'retiredReaderCannotSnapshotReplacementInboundCipher' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'staleReaderFinallyCannotDrainReplacementPendingReply' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'currentReaderExitDrainsWaitersButStaleExitDoesNotEmitCurrentExit' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'failedB233TcpConnectClosesUnpublishedCandidate' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'rejectedB233PublicationClosesCandidateButAcceptedSocketRemainsOwned' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'internal object RtspSocketCandidateCleanup' app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycle.kt
          grep -Fq 'internal object RtspReaderGenerationCleanup' app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycle.kt
          grep -Fq 'replacingReaderCannotInterleaveBetweenOwnershipCheckAndDispatch' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'delayedOldRequestCannotInstallReaderOverReconnectedSocket' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'readerInstallAndRetirementCannotInterleave' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'delayedRequestCannotConsumeReplacementCipherNonce' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'currentButClosedRequestSocketCannotRegisterOrEncrypt' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycleTest.kt
          grep -Fq 'internal object RtspRequestWriteOwnership' app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspSocketLifecycle.kt
          grep -Fq 'socketLifecycle.runIfCurrent(' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'RtspReaderDispatchGate.dispatchIfCurrent(' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          # Keep the actual AirPlayClient teardown inside the same retire gate.
          # A model-only JUnit could otherwise pass while real cleanup still races.
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          # B233 TCP candidates must be closed when connect() throws, before
          # publication, without closing an accepted live session Socket.
          connect = source.split('    private fun ensureConnected(', 1)[1].split(
              '    private fun resolveAddress(', 1
          )[0]
          for token in ('RtspSocketCandidateCleanup.publishOrClose(',
                        'cleanupOnFailure = target.isBuickB233',
                        'newSocket.connect(InetSocketAddress(',
                        'socketLifecycle.tryPublish(connectEpoch)'):
              if token not in connect:
                  raise SystemExit('B233 failed TCP candidate cleanup missing: ' + token)
          if not connect.index('RtspSocketCandidateCleanup.publishOrClose(') < connect.index('newSocket.connect('):
              raise SystemExit('B233 socket cleanup must own candidate before TCP connect')
          # Request write guard must execute *inside* the CSeq/cipher lock.
          # A helper-only test would miss accidental wiring after encryption.
          request = source.split('    private fun request(', 1)[1].split(
              '    /**', 1
          )[0]
          lock_start = request.split('        synchronized(rtspWriteLock) {', 1)[1]
          cseq_pos = lock_start.index('cseq = ++cSeq')
          guard_pos = lock_start.index('RtspRequestWriteOwnership.isCurrent(')
          if not guard_pos < cseq_pos:
              raise SystemExit('B233 request ownership check must precede CSeq/cipher use')
          if 'endpoint.isBuickB233' not in lock_start[:guard_pos]:
              raise SystemExit('B233 request write guard scope missing')
          if 'client, socket, readerSocket, client.isClosed' not in lock_start:
              raise SystemExit('B233 request identity check incomplete')
          # The request reader must reject stale sockets before it can replace
          # a new reader or close the replacement's live socket.
          start_reader = source.split('    private fun startReader(client: Socket) {', 1)[1].split(
              '    /** 待响应的 CSeq', 1
          )[0]
          for token in ('if (endpoint.isBuickB233) {',
                        'socketLifecycle.runIfCurrent(',
                        'socket === client && !client.isClosed',
                        'if (!accepted) throw IOException(',
                        '} else {',
                        'installReader()'):
              if token not in start_reader:
                  raise SystemExit('B233 stale-reader installation gate missing: ' + token)
          # This new reader-dispatch behavior is deliberately B233-only.
          reader = source.split('    private fun readLoop(', 1)[1].split(
              '    private class RtspMessage(', 1
          )[0]
          # Stale reader bytes must be rejected BEFORE they can consume a
          # replacement session's inbound cipher nonce. Checking only at
          # dispatch would be too late for encrypted RTSP frames.
          cipher_snapshot = reader.split('val encryption =', 1)[1].split(
              'if (encryption != null && !encryptedMode)', 1
          )[0]
          for token in ('if (endpoint.isBuickB233) {',
                        'RtspReaderDispatchGate.dispatchIfCurrent(',
                        'generation == readerGeneration && readerSocket === client',
                        'ownedCipher = cipher',
                        ') return',
                        '} else {',
                        'cipher'):
              if token not in cipher_snapshot:
                  raise SystemExit('B233 pre-decrypt reader ownership guard missing: ' + token)
          # PR #72 integration: the real B233 readLoop.finally must compare
          # generation AND drain pending CSeq under the writer lock. The old
          # non-B233 path remains untouched, and wakeup happens outside lock.
          finally_block = reader.split('        } finally {', 1)[1]
          b233_finally = finally_block.split('            } else {', 1)[0]
          for token in ('if (endpoint.isBuickB233) {',
                        'val waiting = synchronized(rtspWriteLock) {',
                        'RtspReaderGenerationCleanup.drainIfCurrent(',
                        'generation, readerGeneration, pendingResponses',
                        'if (waiting != null) {',
                        'waiting.forEach { it.offer(RTSP_CLOSED_MARK'):
              if token not in b233_finally:
                  raise SystemExit('B233 reader finally ownership drain missing: ' + token)
          if not b233_finally.index('synchronized(rtspWriteLock)') < b233_finally.index('RtspReaderGenerationCleanup.drainIfCurrent('):
              raise SystemExit('reader finally generation check must run inside write lock')
          if 'failAllPending("控制通道读线程结束")' not in finally_block.split('            } else {', 1)[1]:
              raise SystemExit('non-B233 reader finally legacy path missing')
          dispatch = reader.split('buffer = parsed.rest', 1)[1].split('        } catch (error: IOException)', 1)[0]
          for token in ('if (endpoint.isBuickB233) {',
                        'RtspReaderDispatchGate.dispatchIfCurrent(',
                        '} else {',
                        'dispatchResponse(parsed.statusLine, parsed.body, parsed.head)'):
              if token not in dispatch:
                  raise SystemExit('B233 scoped dispatch / legacy fallback missing: ' + token)
          close = source.split('    fun close() {', 1)[1].split('    /**', 1)[0]
          gated = close.split('        socketLifecycle.retire {', 1)[1].split(
              '        }\n        runCatching { iapTunnel', 1
          )[0]
          for token in ('socket = null', 'cipher = null', 'synchronized(rtspWriteLock)',
                        'readerGeneration++', 'failAllPending("控制通道关闭")'):
              if token not in gated:
                  raise SystemExit('RTSP teardown escaped retire gate: ' + token)
          print('RTSP reader, cipher and pending teardown remain within retire gate')
          PY
          echo 'T89 runtime source unchanged except RTSP socket lifecycle, no signing or release.'
      - name: Deterministic stale-publication regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.RtspSocketLifecycleTest --stacktrace
      - name: Full Android JUnit, Lint and Debug compile
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# This CI cannot prove the B233 peer EOF cause; no physical car/audio packet changes.
