name: B233 RTSP concurrent TCP candidate ownership (offline)
on:
  pull_request:
    branches:
      - experiment/buick-b233-rtsp-peer-eof-retirement-t94
    paths:
      - '.github/workflows/ci-b233-rtsp-connect-candidate-ownership-gate.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspReaderGenerationCleanup.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspReaderGenerationCleanupTest.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-rtsp-connect-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact verified parent, four-file scope and B233 TCP candidate ownership
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=5131092dcbb462954a5b4de620c4828451169b3e
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41297598922 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41297598922 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/b233-actual
          printf '%s\n' \
            '.github/workflows/ci-b233-rtsp-connect-candidate-ownership-gate.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspReaderGenerationCleanup.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspReaderGenerationCleanupTest.kt' | sort > /tmp/b233-expected
          diff -u /tmp/b233-expected /tmp/b233-actual
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          helper = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspReaderGenerationCleanup.kt').read_text()
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspReaderGenerationCleanupTest.kt').read_text()
          connect = src.split('    private fun ensureConnected(', 1)[1].split('    /**', 1)[0]
          assert 'var candidate: Socket? = null' in connect
          assert 'RtspReaderGenerationCleanup.decideCandidatePublication(' in connect
          assert 'synchronized(rtspWriteLock)' in connect
          assert 'if (it == RtspReaderGenerationCleanup.CandidatePublication.PUBLISH)' in connect
          assert 'return decision == RtspReaderGenerationCleanup.CandidatePublication.KEEP_EXISTING' in connect
          assert 'if (target.isBuickB233) runCatching { candidate?.close() }' in connect
          assert 'enum class CandidatePublication' in helper
          for test in ('firstB233DialMayPublishOnlyWhenEndpointStillMatches',
                       'concurrentB233DialCannotOverwriteAlreadyPublishedConnection'):
              assert test in tests
          print('B233 concurrent TCP dial cannot overwrite active session; failed candidate closes')
          PY
      - name: B233 concurrent dial and stale endpoint negative regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.RtspReaderGenerationCleanupTest --stacktrace
      - name: Full Android JUnit, Lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

