name: E5 iAP2 stop cancellation isolation (#34)
on:
  # Open PR is the single CI authority; each commit must not consume two
  # identical Android build runners via simultaneous push and PR events.
  # workflow_dispatch stays available for an explicit isolated rerun.
  pull_request:
    branches: [Buick-E5]
    paths:
      - 'app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2InterruptibleWait.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/iap2/Iap2InterruptibleWaitTest.kt'
      - '.github/workflows/ci-e5-iap2-stop-cancellation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce fresh E5 base and narrow #34 change scope
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = subprocess.check_output(['git', 'rev-parse', 'origin/Buick-E5'], text=True).strip()
          original_base = '8271f2a71be7b4acc740c2748bf3281810ea9aa1'
          previous_reviewed = 'faf2edb3dc1527cad4e5f17d54ff7c883f73ceb1'
          old_current_base = '6dff31cac9a4a6f1945b787ba01eea577761d0eb'
          current_base = '5e565a08b228d157ff1d739f38b8c09fad80f8a5'
          assert base == current_base, f'E5 baseline changed; review and refresh before proceeding: {base}'
          # #93 only added tests and a test CI; original #34 runtime remains stable.
          latest_93_delta = set(subprocess.check_output(
              ['git', 'diff', '--name-only', old_current_base, current_base], text=True
          ).splitlines())
          assert latest_93_delta == {
              '.github/workflows/ci-e5-test-migration-parser-diagnostics-27.yml',
              'app/src/test/java/io/github/shaonialife/cardeck/airplay/BplistExtendedLengthTest.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/gateway/DiagnosticPreviewSummaryTest.kt',
          }, f'Unexpected post-#93 E5 drift: {sorted(latest_93_delta)}'
          # The E5 baseline advanced only through reviewed L1 changes:
          # #65/#69 Chinese experiment labels and #73 release-floor tests.
          # Keep this exact delta lease; never silently widen #34's L3 scope.
          # #77 only added release-preflight regression coverage; no iAP2,
          # Bluetooth, session teardown, or other runtime file changed.
          # #79 added only two test/CI files at 163ce5e; it did NOT change
          # #34 cancellation, iAP2, Bluetooth or any production runtime code.
          # Unknown future E5 stable movement must fail the baseline lease.
          # #82 only changed official APK auto-publish workflow and its regression tests.
          # The merged stable base is exact, #33/#34 runtime sources are untouched.
          latest_delta = set(subprocess.check_output(
              ['git', 'diff', '--name-only', previous_reviewed, current_base], text=True
          ).splitlines())
          assert latest_delta == {
              '.github/scripts/test_e5_release_preflight.py',
              '.github/workflows/build-buick-e5.yml',
              '.github/workflows/ci-e5-upstream-replay-33.yml',
              'app/src/test/java/io/github/shaonialife/cardeck/replay/B233HandshakeReplayTest.kt',
              '.github/workflows/ci-e5-test-migration-parser-diagnostics-27.yml',
              'app/src/test/java/io/github/shaonialife/cardeck/airplay/BplistExtendedLengthTest.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/gateway/DiagnosticPreviewSummaryTest.kt',
          }, f'Unexpected new E5 stable delta: {sorted(latest_delta)}'
          stable_delta = set(subprocess.check_output(
              ['git', 'diff', '--name-only', original_base, current_base], text=True
          ).splitlines())
          assert stable_delta == {
              '.github/scripts/test_e5_release_preflight.py',
              '.github/workflows/build-buick-e5.yml',
              '.github/workflows/ci-e5-chinese-project-labels.yml',
              '.github/workflows/ci-e5-upstream-replay-33.yml',
              'app/src/test/java/io/github/shaonialife/cardeck/replay/B233HandshakeReplayTest.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalog.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalogTest.kt',
              '.github/workflows/ci-e5-test-migration-parser-diagnostics-27.yml',
              'app/src/test/java/io/github/shaonialife/cardeck/airplay/BplistExtendedLengthTest.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/gateway/DiagnosticPreviewSummaryTest.kt',
          }, f'Unexpected stable E5 drift: {sorted(stable_delta)}'
          files = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/Buick-E5...HEAD'], text=True
          ).splitlines())
          allowed = {
              'app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2InterruptibleWait.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/iap2/Iap2InterruptibleWaitTest.kt',
              '.github/workflows/ci-e5-iap2-stop-cancellation.yml',
          }
          assert files == allowed, f'Unexpected changes: {sorted(files ^ allowed)}'
          root = Path('app/src/main/java/io/github/shaonialife/cardeck')
          helper = (root / 'iap2/Iap2InterruptibleWait.kt').read_text()
          sender = (root / 'iap2/Iap2SenderSession.kt').read_text()
          client = (root / 'bt/Iap2BluetoothClient.kt').read_text()
          assert 'Thread.currentThread().interrupt()' in helper
          assert 'throw IOException(' in helper
          assert 'Iap2InterruptibleWait.sleep(1500L)' in sender
          assert 'Iap2InterruptibleWait.sleep(600)' in client
          assert 'Thread.sleep(1500L)' not in sender
          assert 'Thread.sleep(600)' not in client
          assert 'channel.runSenderSession(' in client
          # stop/start can overlap old worker cleanup. A stale worker must never
          # remove or close the socket/channel published by the new generation.
          assert 'private val activeChannel = AtomicReference<Iap2LinkChannel?>(null)' in client
          assert 'activeChannel.set(channel)' not in client
          assert 'activeChannel.compareAndSet(null, channel)' in client
          assert 'activeChannel.compareAndSet(channel, null)' in client
          assert client.count('activeChannel.getAndSet(null)') == 2
          assert 'currentSocket.compareAndSet(connected, null)' in client
          assert client.count('currentSocket.compareAndSet(socket, null)') == 7  # includes permission-revocation close
          assert client.count('currentSocket.getAndSet(null)') == 2  # only explicit detach/stop
          assert 'currentSocket.set(socket)' not in client
          assert 'runCatching { connected.close() }' in client
          assert 'val socket = tryConnect(device, myGeneration)' in client
          assert 'runSession(connected, myGeneration)' in client
          assert 'private fun tryConnect(device: BluetoothDevice, myGeneration: Long)' in client
          assert 'private fun runSession(socket: BluetoothSocket, myGeneration: Long)' in client
          assert client.count('if (!running || generation.get() != myGeneration)') >= 4
          assert 'if (!running || generation.get() != myGeneration || !currentSocket.compareAndSet(null, socket))' in client
          assert 'if (!activeChannel.compareAndSet(null, channel))' in client
          assert 'activeChannel.compareAndSet(channel, null)' in client
          assert 'channel.runSenderSession(' in client
          # Stream/channel acquisition occurs before runSession's normal finally;
          # fail closed unless an initialization exception retires only its socket.
          assert 'val channel =\n            try {' in client
          assert 'Iap2LinkChannel(stream, name = "iap2-bt-car")' in client
          assert 'catch (error: Exception) {' in client
          assert '控制通道初始化失败' in client
          assert 'activeChannel = null' not in client
          # New narrow revocation guard: compare against the exact prior reviewed HEAD.
          # Only the SDP UUID lookup and RFCOMM create/connect SecurityException paths may change.
          previous_head = 'f514b788ec14e297d05dad19407f3fb2bb40f777'
          client_path = 'app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt'
          ci_path = '.github/workflows/ci-e5-iap2-stop-cancellation.yml'
          changed_since_reviewed = set(subprocess.check_output(
              ['git','diff','--name-only',previous_head,'HEAD'], text=True
          ).splitlines())
          assert changed_since_reviewed == {client_path, ci_path}, (
              'Unexpected new #34 change since reviewed HEAD: ' + str(changed_since_reviewed)
          )
          old_client = subprocess.check_output(
              ['git', 'show', previous_head + ':' + client_path], text=True
          )
          changes = [
              ("        val withService =\n            bonded.filter { device ->\n                device.uuids?.any { it.uuid == ACCESSORY_IAP2_UUID } == true\n            }", "        val withService =\n            bonded.filter { device ->\n                // BLUETOOTH_CONNECT may be revoked after the start() permission check.\n                try {\n                    device.uuids?.any { it.uuid == ACCESSORY_IAP2_UUID } == true\n                } catch (_: SecurityException) {\n                    false\n                }\n            }"),
              ("            } catch (error: IOException) {\n                return null\n            }\n        // 连接前就登记", "            } catch (error: IOException) {\n                return null\n            } catch (_: SecurityException) {\n                log(\"BT-C: 建立 RFCOMM Socket 时蓝牙权限已失效（已跳过本轮）\")\n                return null\n            }\n        // 连接前就登记"),
              ("        } catch (error: IOException) {\n            currentSocket.compareAndSet(socket, null)\n            runCatching { socket.close() }\n            null\n        }\n    }\n\n    private fun runSession", "        } catch (error: IOException) {\n            currentSocket.compareAndSet(socket, null)\n            runCatching { socket.close() }\n            null\n        } catch (_: SecurityException) {\n            // Android permission can be revoked while blocking inside connect().\n            currentSocket.compareAndSet(socket, null)\n            runCatching { socket.close() }\n            log(\"BT-C: RFCOMM 建链中蓝牙权限已失效（本轮连接已释放）\")\n            null\n        }\n    }\n\n    private fun runSession"),
          ]
          expected_client = old_client
          for before_text, after_text in changes:
              assert expected_client.count(before_text) == 1, 'Permission guard baseline drift'
              expected_client = expected_client.replace(before_text, after_text)
          assert client == expected_client, 'Unexpected iAP2 runtime/protocol change'
          assert 'SecurityException' in client
          print('Three permission-only exception guards exactly replayed from prior approved #34 HEAD')
          print('Stop-cancellation only; no protocol timing, Bluetooth profile or reconnect behavior expanded')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and Android Debug compilation (no APK publication)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
