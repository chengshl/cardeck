name: B233 audio UDP bind fail-closed (offline)
on:
  push:
    branches:
      - experiment/buick-b233-audio-udp-bind-failclosed-t94
  pull_request:
    branches:
      - experiment/buick-b233-reverse-rtcp-port-owner-t94
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact verified parent, fail-open negative control and four-file scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=3064fbc264ae23598957ce02b3fa4553f863a50c
          test "$(git rev-parse "$BASE")" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41357254829 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41357254829 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-audio-udp-bind-failclosed.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/audio/AudioVehicleNetworkBindGuardTest.kt' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          git show "$BASE":app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt > /tmp/parent-audio.kt
          git show "$BASE":app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt > /tmp/parent-session.kt
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/parent-audio.kt').read_text()
          new = Path('app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt').read_text()
          session_old = Path('/tmp/parent-session.kt').read_text()
          session_new = Path('app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt').read_text()
          assert 'runCatching { network.bindSocket(client) }' in old
          assert 'runCatching { network.bindSocket(this) }' in old
          assert 'failClosedOnVehicleNetworkBind' not in old
          assert 'failClosedOnVehicleNetworkBind' not in session_old
          assert new.count('bindOwnedAudioDatagramSocket(') == 3
          assert 'if (failClosed) socket.close()' in new
          assert 'failClosedOnVehicleNetworkBind = client.currentEndpoint.isBuickB233' in session_new
          assert session_new.replace('                    failClosedOnVehicleNetworkBind = client.currentEndpoint.isBuickB233,\n', '') == session_old
          test = Path('app/src/test/java/io/github/shaonialife/cardeck/audio/AudioVehicleNetworkBindGuardTest.kt').read_text()
          assert 'b233RejectedVehicleBindClosesSocketInsteadOfUsingDefaultRoute' in test
          assert 'legacyRejectedVehicleBindPreservesBestEffortFallback' in test
          print('parent fail-open RTP/RTCP confirmed; B233-only route guard and legacy negative regression')
          PY
      - name: Android JUnit, Lint and Debug
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 offline only: no signing, Release, install, or stable merge.
