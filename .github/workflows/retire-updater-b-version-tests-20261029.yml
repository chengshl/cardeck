name: Retire completed Updater-B version allocator test releases (keep files)
on:
  push:
    branches:
      - maintenance/retire-updater-b-version-tests-20261029
    paths:
      - '.github/workflows/retire-updater-b-version-tests-20261029.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-updater-b-version-tests-20261029
  cancel-in-progress: false

jobs:
  archive-exact-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify maintenance branch and archive only audited tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "maintenance/retire-updater-b-version-tests-20261029"
          # GitHub Releases retain tag, body history, downloads and SHA256.
          # The updater only accepts artifactKind=experiment; historical is hidden.
          targets=(
            "exp-buick-e5-updater-b-minimal-EXP-ATER-B-MINIMAL-B0C820004E32-261029003|experiment/buick-e5-updater-b-minimal"
            "exp-buick-e5-updater-b-minimal-EXP-ATER-B-MINIMAL-B0C820004E32-261029010|experiment/buick-e5-updater-b-minimal"
          )
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          for item in "${targets[@]}"; do
            tag="${item%%|*}"
            source="${item#*|}"
            echo "::group::Archive $tag"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body,isDraft,isPrerelease,assets,tagName > "$workdir/release.json"
            python3 - "$workdir/release.json" "$workdir/old.txt" "$tag" "$source" <<'PY'
          import json, pathlib, sys
          obj = json.loads(pathlib.Path(sys.argv[1]).read_text())
          tag, source = sys.argv[3], sys.argv[4]
          assert obj["tagName"] == tag and obj["isPrerelease"] and not obj["isDraft"]
          body = obj["body"]
          assert "sourceBranch=" + source in body.splitlines(), "source mismatch"
          assert "updaterSchema=2" in body.splitlines(), "not schema2"
          assert "baseBranch=Buick-E5" in body.splitlines(), "not Buick-E5"
          names = {x["name"] for x in obj["assets"]}
          assert any(name.endswith(".apk") and name + ".sha256" in names for name in names), "missing APK/SHA256"
          pathlib.Path(sys.argv[2]).write_text(body)
          PY
            if grep -qx 'artifactKind=historical' "$workdir/old.txt"; then
              echo "Already archived: $tag"
              echo "::endgroup::"
              continue
            fi
            grep -qx 'artifactKind=experiment' "$workdir/old.txt"
            python3 - "$workdir/old.txt" "$workdir/new.txt" <<'PY'
          import pathlib, sys
          body = pathlib.Path(sys.argv[1]).read_text()
          old = "artifactKind=experiment\n"
          assert body.count(old) == 1
          body = body.replace(old,
              "artifactKind=historical\noriginalArtifactKind=experiment\n"
              "retiredChannel=true\nretiredAt=2026-10-29\n", 1)
          body += "\n## 预发布通道归档（2026-10-29）\n" + (
              "E5 Updater-B已合入稳定分支，额外两份#39版本分配器实验验证Release已完成并从主动订阅目录退役。"
              "APK、SHA256、标签、原始说明及下载链接继续保留；"
              "原始APK及SHA256可继续供#39发布版本历史审计，音频/重连实验维持独立。\n")
          pathlib.Path(sys.argv[2]).write_text(body)
          PY
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$workdir/new.txt" --latest=false
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body,assets,isPrerelease,tagName > "$workdir/verify.json"
            python3 - "$workdir/verify.json" "$tag" <<'PY'
          import json, pathlib, sys
          obj = json.loads(pathlib.Path(sys.argv[1]).read_text())
          lines = obj["body"].splitlines()
          assert obj["tagName"] == sys.argv[2] and obj["isPrerelease"]
          assert "artifactKind=historical" in lines
          assert "originalArtifactKind=experiment" in lines
          assert len(obj["assets"]) >= 2
          PY
            echo "Archived: $tag (APK and SHA256 retained)"
            echo "::endgroup::"
          done
