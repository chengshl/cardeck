name: T74 isolated compile and test (no release)

on:
  push:
    branches:
      - experiment/buick-t74-link-watch
  pull_request:
    branches:
      - Buick-Test
    paths:
      - app/src/main/java/io/github/shaonialife/cardeck/audio/BuickAudioT74LinkGuard.kt
      - app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
      - .github/workflows/t74-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit tests, Android lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
