name: E5 task isolation in Buick-Test - no APK release

on:
  push:
    branches:
      - experiment/buick-test-e5-task-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tests and compile only (no upload or release)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
