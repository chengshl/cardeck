name: Standalone Rescue Collector - signed isolated experiment
on:
  push:
    branches:
      - experiment/cardeck-rescue-standalone
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/publish-rescue-standalone.yml'
  workflow_dispatch:
concurrency:
  group: rescue-standalone-signed
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  signed-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone package and forbidden CarPlay components
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/cardeck-rescue-standalone"
          grep -Fq 'applicationId = "io.github.cardeck.rescue.collector"' app/build.gradle.kts
          grep -Fq 'ForensicOnlyActivity' app/src/main/AndroidManifest.xml
          grep -Fq 'RescueTraceService' app/src/main/AndroidManifest.xml
          grep -Fq 'CollectorReleasePolicy' app/src/main/java/io/github/shaonialife/cardeck/update/CollectorUpdater.kt
          grep -Fq 'CarDeck-Rescue-Standalone.apk' app/src/main/java/io/github/shaonialife/cardeck/update/CollectorReleasePolicy.kt
          if grep -Eq 'name="[^"]*(CarPlayService|GatewayLogService|SenderApp|MainActivity|DockActivity|GridActivity)"' app/src/main/AndroidManifest.xml; then
            echo "::error::Collector must not expose CarPlay, Gateway or legacy app startup components"
            exit 1
          fi
          if grep -Eq 'uses-permission.*(BLUETOOTH|ACCESS_WIFI|RECORD_AUDIO)' app/src/main/AndroidManifest.xml; then
            echo "::error::Unexpected remote or car interface permission"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/JVM unit tests and Debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Diagnose project lint; collector modified-file gate
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug
          lint_rc=$?
          set -e
          if (( lint_rc != 0 )); then
            python3 - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          candidates = sorted(pathlib.Path("app/build/reports").glob("lint-results-debug*.xml"))
          if not candidates:
              sys.exit("::error::Lint has no XML report")
          root = ET.parse(candidates[-1]).getroot()
          changed = ("ForensicOnlyActivity.kt", "RescueTraceService.kt", "AndroidManifest.xml",
                     "LogRedactor.kt", "RescueTraceStore.kt", "RescueTraceContext.kt",
                     "CollectorUpdater.kt", "CollectorReleasePolicy.kt")
          fatal = [item for item in root.findall("issue")
                   if item.get("severity") == "Error" and
                   any(any((loc.get("file") or "").endswith(p) for p in changed)
                       for loc in item.findall("location"))]
          for item in fatal:
              print("::error::Collector lint error", item.get("id"))
          print(f"Collector lint errors: {len(fatal)}")
          if fatal:
              sys.exit(1)
          print("::warning::Existing unrelated baseline lint errors remain")
          PY
          fi
      - name: Restore existing trusted release signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-rescue-standalone.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-rescue-standalone.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-rescue-standalone.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Assign signed build version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$((BUILD_EPOCH - 1704067200))
          (( BUILD_CODE > 0 && BUILD_CODE <= 2100000000 ))
          VERSION="$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)"
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=experiment/cardeck-rescue-standalone" >> "$GITHUB_ENV"
      - name: Build signed standalone collector APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Verify package, signature and compiled origin
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "package: name='io.github.cardeck.rescue.collector'" <<< "$BADGING" || { echo "::error::Not the standalone collector package"; exit 1; }
          "$APKSIGNER" verify "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK")"
          if grep -qi 'CN=Android Debug' <<< "$CERT"; then
            echo "::error::Refusing debug-signed experiment"
            exit 1
          fi
          ORIGIN="$("$AAPT" dump --values resources "$APK")"
          grep -Fq 'cardeck_installed_build_origin' <<< "$ORIGIN"
          grep -Fq 'experiment/cardeck-rescue-standalone' <<< "$ORIGIN"
          cp "$APK" CarDeck-Rescue-Standalone.apk
          sha256sum CarDeck-Rescue-Standalone.apk > CarDeck-Rescue-Standalone.apk.sha256
      - name: Publish collector as independent prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/cardeck-rescue-standalone"
          test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"
          APK=CarDeck-Rescue-Standalone.apk
          TAG="exp-cardeck-rescue-standalone-$CARDECK_RELEASE_VERSION_NAME"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-E5\nsourceBranch=%s\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$SOURCE_BRANCH" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## 取证专用版说明\n'
            printf '专用包名取证版：修复AVC SELinux字段误脱敏，关键异常保留前4后12行、独立512KiB关键证据+普通2MiB滚动日志，10分钟采集心跳、版本来源标记及分段编号。手动开始/停止、手动导出，无4小时停止，不自动上传。增加仅在打开取证界面时自动检查本项目签名预发布，用户确认后下载、SHA256/包名/签名校验及系统安装；不进行后台静默更新，不连接车机/蓝牙/音频。\n'
            printf '\n## 安装与验收\n'
            printf '新包名与E5和Test音频应用完全独立，不覆盖旧应用。旧取证数据不会自动迁移：先在旧取证App导出、停止旧采集，并保留旧App直至迁移验收。新取证助手须单独授权Shizuku、通知，再手动开始采集。避免两个采集服务同时运行，确认下载/CarDeck手动导出、脱敏及独立更新源。实验包未手机验收。\n'
          } > release-notes.txt
          gh release create "$TAG" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "CarDeck 独立取证 $CARDECK_RELEASE_VERSION_NAME（实验）" \
            --notes-file release-notes.txt --prerelease --latest=false
