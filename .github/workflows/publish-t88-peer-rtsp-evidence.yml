name: T88 B233 Peer RTSP Evidence Signed (isolated)
on:
  push:
    branches:
      - experiment/buick-b233-t88-peer-request-evidence
    paths:
      - '.github/workflows/publish-t88-peer-rtsp-evidence.yml'
  workflow_dispatch:
concurrency:
  group: publish-t88-peer-rtsp-evidence
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for signed T85 merge-base scope gate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Gate read-only T88 changes against signed T85
        shell: bash
        run: |
          set -euo pipefail
          BASE="d4b9f4229c1ecc12eb05281cfbd95f58dfe0e661"
          git fetch origin "$BASE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          printf '%s\n' "$CHANGED"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/publish-t88-peer-rtsp-evidence\.yml|app/src/main/java/io/github/shaonialife/cardeck/(SessionController|airplay/(AirPlayClient|AudioFeedbackSampleTime|RtspPeerRequestEvidence))\.kt|app/src/test/java/io/github/shaonialife/cardeck/(airplay/(AudioFeedbackSampleTimeTest|RtspPeerRequestEvidenceTest)|audio/AudioControlLivenessTest)\.kt)$' || true)"
          test -z "$BAD" || { echo "::error::T88 out-of-scope file: $BAD"; exit 1; }
          test -s app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidence.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidenceTest.kt
          grep -Fq 'rtsp_peer_request' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'rtsp_peer_teardown' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'legacyAckEligible' app/src/main/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidence.kt
          grep -Fq 'diagnosticTag' app/src/test/java/io/github/shaonialife/cardeck/airplay/RtspPeerRequestEvidenceTest.kt
          grep -Fq 'delayed_mainAudio_claim before_audio_setup' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          echo "T88 gate passed: scoped read-only evidence"
      - name: 验证 Android 单元测试、Lint 和 Debug 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: 载入 Buick-Test 既有发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t88.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t88.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t88.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 设置严格大于 T85 的新版本码
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89165049
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: 构建原签名 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: 校验 Test 包名、版本、签名并与 T85 证书比对
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" | grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          test -s app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequestTest.kt
          grep -Fq "selectedProject" app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt
          grep -Fq "chooseProject" app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt
          grep -Fq 'reverse_audio_resend_request' app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt
          grep -Fq 'sentPacketCountSnapshot' app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt
          echo "开始验证新签名 APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/t88-cert-details.txt"
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t88-cert-details.txt" | head -n 1)"
          if [ -z "$NEW_CERT" ]; then
            echo "::error::已通过基础签名检查，但未找到证书 SHA-256 信息；停止发布"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t88-cert-details.txt"; then
            echo "::error::检测到 Android Debug 签名，不发布"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/t85-reference"
          gh release download exp-buick-test-t85-20261029080409 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk' \
            --dir "$RUNNER_TEMP/t85-reference"
          OLD_APK="$RUNNER_TEMP/t85-reference/CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" | tee "$RUNNER_TEMP/t85-cert-reference.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t85-cert-reference.txt" | head -n 1)"
          if [ -z "$OLD_CERT" ]; then
            echo "::error::旧版 T85 证书摘要无法解析，停止发布"
            exit 1
          fi
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::新签名与原 T85 Test 发布证书不一致，不允许覆盖升级"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk
          sha256sum CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk > CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk.sha256
          echo "T88 Test APK 包名/版本/签名连续性验证成功"
      - name: 上传签名 APK 和 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T88-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk
            CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk.sha256
          if-no-files-found: error
      - name: Publish isolated T88 diagnostic prerelease (never stable latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-b233-t88-peer-request-evidence"
          test -n "$GITHUB_SHA"
          TAG="exp-buick-test-t88-$CARDECK_RELEASE_VERSION_NAME"
          APK="CarDeck-Buick-Test-T88-PEER-RTSP-EVIDENCE.apk"
          test -s "$APK" && test -s "$APK.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite release tag $TAG"
            exit 1
          fi
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T88 B233 RTSP peer request / TEARDOWN evidence, NOT AN AUDIO FIX\n'
            printf 'Based on signed T85 negative test. Observe sanitized inbound RTSP peer requests, method category, CSeq collision, legacy ACK eligibility and TEARDOWN before reply dispatch. No protocol output, RTSP replies, routing, PCM/AAC, RTP/RTCP, iAP2, Bluetooth, resource-ownership behavior or stable branches changed. T85 audibly played music but peer EOF followed 20.215 seconds after first RTP. Root cause remains unproven.\n'
            printf '\n## One parked-car diagnostic session only\n'
            printf 'Safely park and close other CarDeck connection services. Without uninstalling, upgrade the existing Buick-Test APK, allow projection and play music normally via CarPlay. Keep session until failure or at least 40s. Preserve logs via the existing opt-in diagnostic workflow; the first RTSP event and peer request type are the focus. If failure repeats at 20s, stop and let investigation use the uploaded logs rather than repeating identical tests. >40s is only a preliminary pass, final P0 acceptance still requires 3 runs of at least 3 minutes with audible CarPlay, video/touch and reconnection working without reboots.\n'
            printf '\n## Install/rollback\n'
            printf 'Application ID io.github.buick.test.cardeck; CI checked the same signing certificate as T85 and a strictly higher versionCode, so it may overwrite Test without clearing its data. Cannot downgrade the Test package in-place to lower-code T85; keep distinct io.github.buick.e5.cardeck stable E5 available. Never uninstall/clear Test data merely to downgrade. No stable merge before real-car acceptance.\n'
          } > t88-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T88 Peer RTSP Evidence $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t88-experiment-release.txt --prerelease --latest=false
