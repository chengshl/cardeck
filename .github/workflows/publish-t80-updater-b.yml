name: T80 已验收 Updater-B 与 T79 音频只读诊断签名发布
on:
  push:
    branches:
      - experiment/buick-test-t76-aac-causality-observe
    paths:
      - '.github/workflows/publish-t80-updater-b.yml'
  workflow_dispatch:
concurrency:
  group: publish-t80-aac-causality
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: 确保本次只移植更新器，既有音频协议与主会话完全未改
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 2265ab202f7c34fd73cb3446b8cc93aad96a7383
          CHANGED="$(git diff --name-only 2265ab202f7c34fd73cb3446b8cc93aad96a7383 HEAD)"
          printf '%s\n' "$CHANGED"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(app/src/main/java/io/github/shaonialife/cardeck/update/|app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt$|app/src/test/java/io/github/shaonialife/cardeck/update/|\.github/workflows/publish-t80-updater-b.yml$)' || true)"
          test -z "$BAD" || { echo "::error::发现非更新器代码变更：$BAD"; exit 1; }
          test -s app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalog.kt
          test -s app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentPickerDialog.kt
          test -s app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentDownloadDialog.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalogTest.kt
      - name: 验证 Android 单元测试、Lint 和 Debug 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: 载入 Buick-Test 既有发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t80.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t80.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t80.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 设置版本号（大于旧 Test 取证安装版本）
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89093551
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: 构建原签名 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: 校验 Test 包名、版本、签名并与 T75 证书比对
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" | grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          test -s app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequestTest.kt
          grep -Fq "selectedProject" app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt
          grep -Fq "chooseProject" app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt
          grep -Fq 'reverse_audio_resend_request' app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt
          grep -Fq 'sentPacketCountSnapshot' app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt
          echo "开始验证新签名 APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/t80-cert-details.txt"
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t80-cert-details.txt" | head -n 1)"
          if [ -z "$NEW_CERT" ]; then
            echo "::error::已通过基础签名检查，但未找到证书 SHA-256 信息；停止发布"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t80-cert-details.txt"; then
            echo "::error::检测到 Android Debug 签名，不发布"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/t75-reference"
          gh release download exp-buick-test-t75-20261026122056 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T75-RTCP-OBS.apk' \
            --dir "$RUNNER_TEMP/t75-reference"
          OLD_APK="$RUNNER_TEMP/t75-reference/CarDeck-Buick-Test-T75-RTCP-OBS.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" | tee "$RUNNER_TEMP/t75-cert-details.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t75-cert-details.txt" | head -n 1)"
          if [ -z "$OLD_CERT" ]; then
            echo "::error::旧版 T75 证书摘要无法解析，停止发布"
            exit 1
          fi
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::新签名与原 T75 Test 发布证书不一致，不允许覆盖升级"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T80-UPDATER-B-NACK-OBS.apk
          sha256sum CarDeck-Buick-Test-T80-UPDATER-B-NACK-OBS.apk > CarDeck-Buick-Test-T80-UPDATER-B-NACK-OBS.apk.sha256
          echo "T80 Test APK 包名/版本/签名连续性验证成功"
      - name: 上传签名 APK 和 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T80-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T80-UPDATER-B-NACK-OBS.apk
            CarDeck-Buick-Test-T80-UPDATER-B-NACK-OBS.apk.sha256
          if-no-files-found: error
      - name: 发布独立 T80 prerelease，不更改 stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t76-aac-causality-observe"
          TAG="exp-buick-test-t80-$CARDECK_RELEASE_VERSION_NAME"
          APK="CarDeck-Buick-Test-T80-UPDATER-B-NACK-OBS.apk"
          test -s "$APK" && test -s "$APK.sha256"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T80：T79 0xD5只读音频诊断 + 已验证 Updater-B 软件更新模块（L3仍未修复）\n'
            printf '选择性同步 Buick-Test 稳定版已验证的项目级Updater-B：能选择并记住单个实验功能线，自动检查只查当前订阅项目；深色项目选择/进度视图、可信Release、SHA256与本包版本/包名核查、手动确认安装。旧用户渠道选择仍保留，未明确选择项目时不自动切到别的项目。界面明确更新频道不代表已安装APK来源；CarPlay音频实验线展示清晰名称。保留T79对0xD5 requestSeq/firstMissingSeq/count与发送区间只读解析；音频AAC、RTSP SETUP、RTP/RTCP发送、重传回复、会话断开/重连代码和E5稳定线均未修改。没有0xD6响应，尚未实车验收，不是20秒断连修复。\n'
            printf '\n## 安装风险\n'
            printf 'Test applicationId 与旧 Test 取证 App 相同，安装会覆盖旧取证程序。覆盖前先导出日志并停止采集。新独立 Rescue Standalone 包名不同，不会被覆盖。旧版本不能直接覆盖更新的 versionCode。\n'
          } > t80-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T80 Updater-B + T79 音频诊断 $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t80-experiment-release.txt --prerelease --latest=false
