name: E5 B233 upstream replay adaptation (test-only)

on:
  push:
    branches:
      - experiment/buick-e5-upstream-replay-33-20261030
  pull_request:
    branches:
      - Buick-E5
    paths:
      - 'app/src/test/java/io/github/shaonialife/cardeck/replay/B233HandshakeReplayTest.kt'
      - '.github/workflows/ci-e5-upstream-replay-33.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail closed if runtime files or stable code changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Buick-E5 --quiet
          git diff --name-only origin/Buick-E5...HEAD > /tmp/e5-replay-changed-files
          test -s /tmp/e5-replay-changed-files
          while IFS= read -r path; do
            case "$path" in
              app/src/test/java/io/github/shaonialife/cardeck/replay/B233HandshakeReplayTest.kt|.github/workflows/ci-e5-upstream-replay-33.yml) ;;
              *) echo "Unauthorized change in test-only replay PR: $path"; exit 1 ;;
            esac
          done < /tmp/e5-replay-changed-files
          grep -Fxq 'app/src/test/java/io/github/shaonialife/cardeck/replay/B233HandshakeReplayTest.kt' /tmp/e5-replay-changed-files
          test "$(grep -c 'Fixture(' app/src/test/java/io/github/shaonialife/cardeck/replay/B233HandshakeReplayTest.kt)" -ge 3
      - name: Run all three synthetic B233 ACK109 scenarios on the production link engine
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.replay.B233HandshakeReplayTest --stacktrace
      - name: Full Android JUnit and Debug compile
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Observe baseline Lint and reject new test-only regressions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:lintDebug --stacktrace > /tmp/e5-replay-lint.log 2>&1
          lint_rc=$?
          set -e
          if [ "$lint_rc" -eq 0 ]; then
            echo 'Full Lint: passed' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Branch changes only one new test and this workflow (whitelist
          # above). Known E5 stable production sources are byte-identical.
          # A new test-path Lint error is a regression and MUST fail the job.
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          test -s "$report" || { tail -n 70 /tmp/e5-replay-lint.log; exit 1; }
          if grep -F 'B233HandshakeReplayTest.kt:' "$report" >/dev/null; then
            echo 'New test file has Lint issues; fail closed.'
            grep -F 'B233HandshakeReplayTest.kt:' "$report"
            exit 1
          fi
          # Fail closed if this is a new class of issue instead of the
          # diagnosed pre-existing CarInputServiceImpl WrongConstant failure.
          grep -F 'CarInputServiceImpl.kt' "$report" >/dev/null || {
            echo 'Unexpected Lint failure; not an acknowledged E5 baseline issue.'
            tail -n 70 /tmp/e5-replay-lint.log
            exit 1
          }
          echo '::warning::E5 baseline lintDebug is red in unchanged production sources; not marked as passed.'
          echo 'Full Lint: FAILED (unchanged E5 baseline; no new test-file diagnostics). Full JUnit/Debug compilation separately gated.' >> "$GITHUB_STEP_SUMMARY"
          tail -n 22 /tmp/e5-replay-lint.log

# Only synthesized message IDs, no recordings/keys/MAC/AP credentials.
# The test does NOT certify real-car replay, successful 0x4301 or screen takeover.
