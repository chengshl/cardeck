name: Buick-E5 experiment Chinese labels regression (#27)
on:
  push:
    branches: [feature/e5-experiment-chinese-labels-27]
  pull_request:
    branches: [Buick-E5]
    paths:
      - 'app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalog.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalogTest.kt'
      - '.github/workflows/ci-e5-chinese-project-labels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-e5-ui-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android unit tests and Debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Run full Lint and reject errors on modified files (preserve existing E5 lint debt)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:lintDebug --stacktrace > e5-lint-output.txt 2>&1
          LINT_EXIT=$?
          set -e
          if (( LINT_EXIT != 0 )); then
            grep -E 'Lint found|First failure:' e5-lint-output.txt | head -n 8 || true
          fi
          python3 - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          allowed = {
              'app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalog.kt',
              'app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalogTest.kt',
              '.github/workflows/ci-e5-chinese-project-labels.yml',
              'app/src/main/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicy.kt',
              'app/src/test/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicyTest.kt',
              '.github/workflows/ci-e5-recovery-entry-17.yml',
          }
          diff = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/Buick-E5...HEAD'], text=True
          ).splitlines())
          if not diff or not diff.issubset(allowed):
              raise SystemExit(f'Unexpected changed paths: {sorted(diff - allowed)}')
          report = Path('app/build/reports/lint-results-debug.xml')
          if not report.is_file():
              raise SystemExit('Lint XML missing: refusing to waive an unreviewed Lint failure')
          root = ET.parse(report).getroot()
          issues = []
          for issue in root.findall('.//issue'):
              if issue.get('severity', '').lower() not in ('error', 'fatal'):
                  continue
              loc = issue.find('location')
              p = (loc.get('file', '') if loc is not None else '').replace('\\', '/')
              if '/app/' in p:
                  p = 'app/' + p.split('/app/', 1)[1]
              issues.append((issue.get('id'), p))
          touched = [(i,p) for i,p in issues if p in allowed]
          print(f'E5 Lint errors reported: {len(issues)}; on modified files: {len(touched)}')
          if touched:
              raise SystemExit(f'New/touched-file Lint errors: {touched}')
          print('Existing unrelated E5 Lint errors remain technical debt; this PR does not change their code.')
          PY
      - name: Verify this change does not modify the E5 release channel or core runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          catalog = Path('app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalog.kt').read_text()
          history = Path('app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt').read_text()
          assert 'fun name(sourceBranch: String)' in catalog
          # Known active #28 published experiment must render Chinese instead of English fallback.
          assert '"experiment/buick-e5-video-firstframe-observability" -> "视频首帧与停帧诊断（#28）"' in catalog
          # Preflight the real sourceBranch planned for the isolated #33 ACK experiment.
          assert '"experiment/buick-e5-iap2-stale-ack-guard-33" -> "iAP2 重连 ACK 防误确认（#33）"' in catalog
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/update/ExperimentProjectCatalogTest.kt').read_text()
          assert 'plannedAckGuardExperimentUsesExactChineseSourceAndCannotCrossSubscribe' in tests
          assert 'source + "-extra"' in tests
          assert 'sourceBranch == selectedSource' in catalog
          assert 'ExperimentProjectCatalog.name(candidate.sourceBranch)' in history
          assert 'if (ReleaseBuildTime.metadata(body, "artifactKind") != "experiment") continue' in history
          assert 'if (!ReleaseVersionName.isExperimental(name, source)) continue' in history
          # The separate #17 workflow enforces exact 6-file scope. Keep this
          # Chinese-source gate active for shared updater/UI changes as well.
          recovery = Path('app/src/main/java/io/github/shaonialife/cardeck/update/E5RecoveryPolicy.kt')
          if recovery.exists():
              policy = recovery.read_text()
              assert 'field("recoveryFor") != installedRelease.tag' in policy
              assert 'field("sourceBranch") != RECOVERY_SOURCE' in policy
              assert 'field("stableRuntimeCommit") != STABLE_RUNTIME' in policy
          PY
