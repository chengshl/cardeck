name: T85 B233 Delayed Main Audio Claim Signed
on:
  push:
    branches:
      - experiment/buick-test-t76-aac-causality-observe
    paths:
      - '.github/workflows/publish-t85-delayed-audio-claim.yml'
  workflow_dispatch:
concurrency:
  group: publish-t85-mode-request-capture
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify T85 changes are isolated from T84
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 8c69ee46788adf9c7c142c1d89d30e4c9b059c4a
          CHANGED="$(git diff --name-only 8c69ee46788adf9c7c142c1d89d30e4c9b059c4a HEAD)"
          printf '%s\n' "$CHANGED"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/publish-t85-delayed-audio-claim\.yml|app/src/main/java/io/github/shaonialife/cardeck/(SessionController|airplay/(AirPlayClient|AirPlayModeClaims))\.kt|app/src/test/java/io/github/shaonialife/cardeck/airplay/(B233ModeRequestSummaryTest|AirPlayModeClaimsTest)\.kt)
          test -z "$BAD" || { echo "::error::Out-of-scope change: $BAD"; exit 1; }
          grep -Fq 'b233AudioClaimPrepared = client.b233AudioClaimPrepared' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          grep -Fq 'delayed_mainAudio_claim before_audio_setup' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          grep -Fq 'client.b233AudioClaimPrepared = false' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          grep -Fq 'b233AudioClaimPrepared: Boolean = false' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 't85B233InitialAudioIntentDoesNotClaimMainAudioBeforeRealSetup' app/src/test/java/io/github/shaonialife/cardeck/airplay/AirPlayModeClaimsTest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ModeRequestSummaryTest.kt
      - name: 验证 Android 单元测试、Lint 和 Debug 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: 载入 Buick-Test 既有发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t85.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t85.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t85.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 设置严格大于 T83 的新版本码
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89131769
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: 构建原签名 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: 校验 Test 包名、版本、签名并与 T84 证书比对
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" | grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          test -s app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequestTest.kt
          grep -Fq "selectedProject" app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt
          grep -Fq "chooseProject" app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt
          grep -Fq 'reverse_audio_resend_request' app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt
          grep -Fq 'sentPacketCountSnapshot' app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt
          echo "开始验证新签名 APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/t85-cert-details.txt"
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t85-cert-details.txt" | head -n 1)"
          if [ -z "$NEW_CERT" ]; then
            echo "::error::已通过基础签名检查，但未找到证书 SHA-256 信息；停止发布"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t85-cert-details.txt"; then
            echo "::error::检测到 Android Debug 签名，不发布"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/t84-reference"
          gh release download exp-buick-test-t84-20261028224929 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T84-MODE-REQUEST-CAPTURE.apk' \
            --dir "$RUNNER_TEMP/t84-reference"
          OLD_APK="$RUNNER_TEMP/t84-reference/CarDeck-Buick-Test-T84-MODE-REQUEST-CAPTURE.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" | tee "$RUNNER_TEMP/t84-cert-details.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t84-cert-details.txt" | head -n 1)"
          if [ -z "$OLD_CERT" ]; then
            echo "::error::旧版 T84 证书摘要无法解析，停止发布"
            exit 1
          fi
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::新签名与原 T84 Test 发布证书不一致，不允许覆盖升级"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk
          sha256sum CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk > CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk.sha256
          echo "T85 Test APK 包名/版本/签名连续性验证成功"
      - name: 上传签名 APK 和 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T85-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk
            CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk.sha256
          if-no-files-found: error
      - name: 发布独立 T85 数字字段取证 prerelease，不更改 stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t76-aac-causality-observe"
          TAG="exp-buick-test-t85-$CARDECK_RELEASE_VERSION_NAME"
          APK="CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk"
          test -s "$APK" && test -s "$APK.sha256"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T85：B233 音频资源声明延迟到真实 SETUP 前（L3单变量）\n'
            printf '相比T84，仅调整B233主音频modesChanged声明时机：初始会话/屏幕SETUP和RECORD期间仅声明主屏；权限/密钥/接收地址/音频候选全部就绪后、第一条音频SETUP前，才声明主音频；后续changeModes重申使用同一会话准备标志。非B233接收端、屏幕流、AAC/PCM档位、RTP/RTCP、时间戳、事件空200正文、蓝牙和恢复策略不变。没有实现新的changeModes业务应答。\n'
            printf 'T84实车首RTP后20.014秒EOF，尚无根因证实；本版是单变量因果试验，非断连已修复。无法确认音频资源声明的RTSP200时，跳过音频SETUP保留视频，避免硬启动音轨。\n'
            printf '\n## 安全停车最小测试及通过标准\n'
            printf '先关闭其它CarDeck连接服务，仅用本版开启CarPlay音频、授权MediaProjection，观察是否进入音频SETUP/RECORD和开始真实RTP，连续播放到断连或超过30秒。若仍在20秒附近断开，由Gateway核对AUDIO T85与T76同一trace；若超过30秒也不算最终通过，继续3轮每轮至少3分钟真实车机扬声器出声、视频触摸稳定、每轮退出后能重连、无重启，并核查仅视频+A2DP不退化。\n'
            printf '\n## 安装与回退边界\n'
            printf 'Test applicationId和原签名均不变，版本码高于T84，可覆盖并保留数据；低码T84无法无损覆盖降级。发生异常立即停止实验，保留Gateway日志；可继续使用不同包名的稳定E5视频模式，不能通过卸载清数据假装无损回滚。未验收禁止合入Buick-Test/Buick-E5/Buick/main。\n'
          } > t85-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T85 Mode Request Capture $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t85-experiment-release.txt --prerelease --latest=false
 || true)"
          test -z "$BAD" || { echo "::error::Out-of-scope change: $BAD"; exit 1; }
          grep -Fq 'auditB233ModeRequest(command)' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          grep -Fq 'b233ModeRequestAuditCount >= 12' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'Never includes' app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeRequestSummary.kt
          grep -Fq 'appleInternScalars = true' app/src/main/java/io/github/shaonialife/cardeck/airplay/ModeResponseCandidate.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/ModeResponseCandidateTest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ModeRequestSummaryTest.kt
      - name: 验证 Android 单元测试、Lint 和 Debug 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: 载入 Buick-Test 既有发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t85.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t85.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t85.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 设置严格大于 T83 的新版本码
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89131769
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: 构建原签名 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: 校验 Test 包名、版本、签名并与 T84 证书比对
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" | grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          test -s app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequestTest.kt
          grep -Fq "selectedProject" app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt
          grep -Fq "chooseProject" app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt
          grep -Fq 'reverse_audio_resend_request' app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt
          grep -Fq 'sentPacketCountSnapshot' app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt
          echo "开始验证新签名 APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/t85-cert-details.txt"
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t85-cert-details.txt" | head -n 1)"
          if [ -z "$NEW_CERT" ]; then
            echo "::error::已通过基础签名检查，但未找到证书 SHA-256 信息；停止发布"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t85-cert-details.txt"; then
            echo "::error::检测到 Android Debug 签名，不发布"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/t84-reference"
          gh release download exp-buick-test-t84-20261028224929 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T84-MODE-REQUEST-CAPTURE.apk' \
            --dir "$RUNNER_TEMP/t84-reference"
          OLD_APK="$RUNNER_TEMP/t84-reference/CarDeck-Buick-Test-T84-MODE-REQUEST-CAPTURE.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" | tee "$RUNNER_TEMP/t84-cert-details.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t84-cert-details.txt" | head -n 1)"
          if [ -z "$OLD_CERT" ]; then
            echo "::error::旧版 T84 证书摘要无法解析，停止发布"
            exit 1
          fi
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::新签名与原 T84 Test 发布证书不一致，不允许覆盖升级"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk
          sha256sum CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk > CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk.sha256
          echo "T85 Test APK 包名/版本/签名连续性验证成功"
      - name: 上传签名 APK 和 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T85-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk
            CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk.sha256
          if-no-files-found: error
      - name: 发布独立 T85 数字字段取证 prerelease，不更改 stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t76-aac-causality-observe"
          TAG="exp-buick-test-t85-$CARDECK_RELEASE_VERSION_NAME"
          APK="CarDeck-Buick-Test-T85-DELAYED-AUDIO-CLAIM.apk"
          test -s "$APK" && test -s "$APK.sha256"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T85：B233 changeModes 字段定向取证（L3）\n'
            printf '只在已建立的B233 CarPlay会话中，为前12条changeModes请求记录资源ID、操作码、优先级、约束和appState等白名单数字字段；严格不记录原始plist、请求原因、地址、密钥或设备标识。不改变事件通道空HTTP200应答、不应用任何借用/归还状态事务，不修改modesChanged现有发送、音视频编码/推流、RTCP、重连、蓝牙或T83安全回退。\n'
            printf '另加入无运行时调用的native iPhone 210/220字节应答结构候选与单元测试；成功的长度匹配不等于已确认车机实际接受该结构。这不是20秒断连修复，需一次真实音频复现取得脱敏请求参数后才能决定下轮协议单变量修改。\n'
            printf '\n## 安装与回退限制\n'
            printf '沿用原Buick-Test签名及同包名，可覆盖已安装T83且保留数据；versionCode严格递增，旧T83不可直接低版本覆盖恢复。不要卸载或清除数据；不同包名无需覆盖，但勿同时建立两条CarPlay控制会话。停车后测试，日志自动由已授权的诊断通道保存。\n'
          } > t85-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T85 Mode Request Capture $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t85-experiment-release.txt --prerelease --latest=false
