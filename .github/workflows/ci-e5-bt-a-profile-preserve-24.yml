name: E5 B233 Bluetooth profile protection isolated regression (#24)
on:
  push:
    branches: [work/e5-bt-a-profile-preserve-24-20261030]
  pull_request:
    branches: [Buick-E5]
    paths:
      - 'app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/bt/BuickB233Route.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/bt/BuickB233ProfilePreserveTest.kt'
      - '.github/workflows/ci-e5-bt-a-profile-preserve-24.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-bt-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact E5 baseline and profile-only diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = subprocess.check_output(['git', 'rev-parse', 'origin/Buick-E5'], text=True).strip()
          assert base == 'faf2edb3dc1527cad4e5f17d54ff7c883f73ceb1', f'E5 baseline moved; re-review required: {base}'
          client = 'app/src/main/java/io/github/shaonialife/cardeck/bt/Iap2BluetoothClient.kt'
          route = 'app/src/main/java/io/github/shaonialife/cardeck/bt/BuickB233Route.kt'
          test = 'app/src/test/java/io/github/shaonialife/cardeck/bt/BuickB233ProfilePreserveTest.kt'
          workflow = '.github/workflows/ci-e5-bt-a-profile-preserve-24.yml'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/Buick-E5...HEAD'], text=True
          ).splitlines())
          assert changed == {client, route, test, workflow}, f'Unexpected diff: {changed}'
          old = subprocess.check_output(['git', 'show', 'origin/Buick-E5:' + client], text=True)
          new = Path(client).read_text()
          before = '''                if (!t35Buick) run {
                    val dropped = BtProfiles.disconnect(context, device)'''
          after = '''                // #24 BT-A: keep ordinary HFP/A2DP connected for a narrowly
                // identified B233 candidate. This does not change RFCOMM,
                // iAP2 handshakes, retry pacing or other receivers.
                val selected = targetProvider()
                val protectB233Profiles = BuickB233Route.shouldProtectProfiles(
                    advertisedName = name,
                    selectedName = selected?.name,
                    selectedMatchesDevice = selected != null &&
                        TargetDevicePrefs.matches(selected, device.address),
                )
                if (protectB233Profiles) {
                    val now = android.os.SystemClock.uptimeMillis()
                    if (now - lastProfileLogAt > PROFILE_LOG_THROTTLE_MILLIS) {
                        lastProfileLogAt = now
                        log("BT-C T22: B233 candidate; HFP/A2DP/LE profile disconnect skipped")
                    }
                } else run {
                    val dropped = BtProfiles.disconnect(context, device)'''
          assert old.count(before) == 1
          assert new == old.replace(before, after), 'Unrelated runtime behavior changed'
          policy = Path(route).read_text()
          assert 'BUICK_[0-9]{4}' in policy
          assert 'selectedMatchesDevice && isKnownReceiver(selectedName)' in policy
          assert 'BluetoothDevice.disconnect' not in new.replace(old.replace(before, ''), '')
          checks = Path(test).read_text()
          assert 'protectsOnlyB233CandidateOrExplicitlyMatchedSelection' in checks
          assert 'narrowlyMatchesFourDigitBuickHint' in checks
          print('Profile-only L3 isolation verified; no other runtime change')
          PY
      - name: Run Android unit tests, Debug and Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
