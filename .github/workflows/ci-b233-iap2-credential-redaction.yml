name: B233 iAP2 credential redaction isolation (offline)

on:
  pull_request:
    branches:
      - experiment/buick-test-t89-pcm-reverse-rtcp
    paths:
      - '.github/workflows/ci-b233-iap2-credential-redaction.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/transport/Iap2LinkChannel.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSessionTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b233-iap2-redaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact signed T89 base and four-file isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=06255735f4ca7a2106fd69b5d4953ecb56cf325c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/b233-iap2-scope
          test "$(wc -l < /tmp/b233-iap2-scope)" -eq 4
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci-b233-iap2-credential-redaction.yml|app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt|app/src/main/java/io/github/shaonialife/cardeck/transport/Iap2LinkChannel.kt|app/src/test/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSessionTest.kt) ;;
              *) echo "Unexpected file: $file"; exit 1 ;;
            esac
          done < /tmp/b233-iap2-scope
          python3 - <<'PY'
          from pathlib import Path
          session = Path('app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt').read_text()
          transport = Path('app/src/main/java/io/github/shaonialife/cardeck/transport/Iap2LinkChannel.kt').read_text()
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSessionTest.kt').read_text()
          assert 'channel.suppressSensitiveRawFrames()' in session
          assert 'wireless.joinToString(" ") { param -> "#${param.id}(${param.value.size}B redacted)" }' in session
          assert 'shown.joinToString("") { "%02x".format(it) }' not in session
          assert 'fun suppressSensitiveRawFrames()' in transport
          assert 'RAW rx: redacted bytes=' in transport
          assert 'RAW tx: redacted bytes=' in transport
          assert 'B233 logs leaked hex-encoded Wi-Fi password' in tests
          assert 'B233 raw transport logging was not redacted' in tests
          PY
      - name: B233 credential leak negative regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.iap2.Iap2SenderSessionTest --stacktrace
      - name: Full Android JUnit, Lint and Debug compile
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# No signing, Release, stable merge or vehicle acceptance from this workflow.
