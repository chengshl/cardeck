name: B233 heartbeat session ownership isolation (test only)

on:
  pull_request:
    branches:
      - experiment/buick-test-t89-pcm-reverse-rtcp
    paths:
      - '.github/workflows/ci-b233-heartbeat-session-ownership.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233HeartbeatSessionGate.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233HeartbeatSessionGateTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b233-heartbeat-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact signed T89 base, four-file scope and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          BASE=06255735f4ca7a2106fd69b5d4953ecb56cf325c
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/heartbeat-scope
          test "$(wc -l < /tmp/heartbeat-scope)" -eq 4
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci-b233-heartbeat-session-ownership.yml|app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt|app/src/main/java/io/github/shaonialife/cardeck/airplay/B233HeartbeatSessionGate.kt|app/src/test/java/io/github/shaonialife/cardeck/airplay/B233HeartbeatSessionGateTest.kt) ;;
              *) echo "Unexpected change: $file"; exit 1 ;;
            esac
          done < /tmp/heartbeat-scope
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          gate = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/B233HeartbeatSessionGate.kt').read_text()
          test = Path('app/src/test/java/io/github/shaonialife/cardeck/airplay/B233HeartbeatSessionGateTest.kt').read_text()
          assert 'private val b233HeartbeatSessionGate = B233HeartbeatSessionGate()' in src
          assert 'AtomicLong(0L)' in gate and 'incrementAndGet()' in gate
          close = src.split('    fun close() {',1)[1].split('    /**',1)[0]
          assert close.index('b233HeartbeatSessionGate.retire()') < close.index('socket?.close()')
          keep = src.split('    fun startKeepAlive(',1)[1].split('    fun startFeedbackLoop()',1)[0]
          feedback = src.split('    fun startFeedbackLoop()',1)[1].split('    /** 解析并打印',1)[0]
          for name, section in (('keepAlive',keep), ('feedback',feedback)):
              assert section.index('b233HeartbeatSessionGate.snapshot()') < section.index('Thread({'), name
              assert 'val b233HeartbeatWorker = endpoint.isBuickB233' in section, name
              assert '(!b233HeartbeatWorker || b233HeartbeatSessionGate.isCurrent(heartbeatToken))' in section, name
          assert '@Synchronized' in gate and 'fun runIfCurrent(token: Long, action: () -> Unit): Boolean' in gate
          assert 'fun retire(): Long = generation.incrementAndGet()' in gate
          assert 'b233HeartbeatSessionGate.runIfCurrent(heartbeatToken)' in keep
          assert 'activeUdp.send(datagram)' in keep
          assert 'expectedB233SessionToken: Long? = null' in src
          request = src.split('    private fun request(',1)[1].split('    /**',1)[0]
          assert 'b233HeartbeatSessionGate.captureIfCurrent(expectedB233SessionToken)' in request
          assert 'val client =' in request and 'startReader(it)' in request
          assert request.index('captureIfCurrent(expectedB233SessionToken)') < request.index('synchronized(rtspWriteLock)')
          assert '!b233HeartbeatSessionGate.isCurrent(expectedB233SessionToken)' in request
          assert request.index('synchronized(rtspWriteLock)') < request.index('output.write(wire)')
          assert 'runIfCurrent(expectedB233SessionToken, writeRequest)' not in request
          assert 'fun <T : Any> captureIfCurrent(token: Long, capture: () -> T): T?' in gate
          assert 'expectedB233SessionToken = if (b233HeartbeatWorker) heartbeatToken else null' in feedback
          assert 'if (b233HeartbeatWorker && !b233HeartbeatSessionGate.isCurrent(heartbeatToken)) break' in feedback
          for name in ('oldKeepAliveCannotPingRetiredHostAfterFastReconnect',
                       'delayedOldFeedbackWorkerCannotAdoptReplacementSession',
                       'feedbackResponseAfterCloseCannotBeReportedAsNewSession',
                       'runIfCurrentRejectsStaleNetworkActionsAfterRetirement',
                       'capturedRtspSocketCannotAdoptNewSessionAfterRetirement',
                       'retirementIsNotBlockedByPausedRtspWriteAfterSocketCapture',
                       'nonB233LegacyWorkerDoesNotDependOnGate'):
              assert name in test, name
          print('B233 only: final UDP send and RTSP heartbeat write are serialized with session retirement; non-B233 unchanged')
          PY
      - name: Deterministic B233 stale-heartbeat regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.B233HeartbeatSessionGateTest --stacktrace
      - name: Full Android JUnit, Lint and Debug compile
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# No signing, release, stable merge or vehicle acceptance from this workflow.
