name: T94 signed APK updater catalog compatibility
on:
  push:
    branches:
      - experiment/buick-test-t94-pcm-short-read
    paths:
      - '.github/workflows/publish-t94-updater-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-t94-updater-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify alias contains exact signed T94 application code only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=1834fd9a05dfd7d19a29dba641ea38af063d0522
          ORIGINAL=exp-buick-test-t94-20261031175159
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t94-pcm-short-read"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SOURCE" "$GITHUB_SHA"
          test "$(git diff --name-only "$SOURCE" "$GITHUB_SHA")" = '.github/workflows/publish-t94-updater-catalog.yml'
          git diff --check "$SOURCE" "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41190133408" --jq '.head_sha')" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41190133408" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41190137017" --jq '.head_sha')" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41190137017" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ORIGINAL" --jq '.target_commitish')" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ORIGINAL" --jq '.draft')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ORIGINAL" --jq '.prerelease')" = true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ORIGINAL" --jq .body | grep -Fxq 'sourceBranch=experiment/buick-b233-pcm-partial-read-continuity'
      - name: Verify unchanged T94 APK checksum, identity, version and T91 certificate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t94" "$RUNNER_TEMP/t91"
          gh release download exp-buick-test-t94-20261031175159 --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T94-PCM-SHORT-READ.apk*' --dir "$RUNNER_TEMP/t94"
          gh release download exp-buick-test-t91-20261031161402 --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T91-PROJECTION-REGRANT.apk' --dir "$RUNNER_TEMP/t91"
          cp "$RUNNER_TEMP/t94/"* .
          APK=CarDeck-Buick-Test-T94-PCM-SHORT-READ.apk
          test -s "$APK" && test -s "$APK.sha256"
          sha256sum -c "$APK.sha256"
          test "$(sha256sum "$APK" | cut -d' ' -f1)" = 25b8be9764e54ef71a848f6c18b7ebf72690a586eb06daf980ef7124c5e17d2b
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | \
            grep -F "versionCode='89373119'" | grep -F "versionName='20261031175159'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/t94cert"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/t91/CarDeck-Buick-Test-T91-PROJECTION-REGRANT.apk" > "$RUNNER_TEMP/t91cert"
          NEW="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t94cert" | head -n 1)"
          OLD="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t91cert" | head -n 1)"
          test -n "$NEW" && test "$NEW" = "$OLD"
          ! grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t94cert"
          test 89373119 -gt 89367242
      - name: Publish exact T94 signed APK into old Test experiment project list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=exp-buick-test-t94-catalog-20261031175159
          APK=CarDeck-Buick-Test-T94-PCM-SHORT-READ.apk
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t94-pcm-short-read"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite any existing release/tag"; exit 1
          fi
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\n'
            printf 'sourceBranch=experiment/buick-test-t94-pcm-short-read\n'
            printf 'applicationId=io.github.buick.test.cardeck\n'
            printf 'versionName=20261031175159\nversionCode=89373119\n'
            printf 'builtAt=2026-10-31T09:55:42Z\n'
            printf 'apkName=%s\n' "$APK"
            printf 'commit=1834fd9a05dfd7d19a29dba641ea38af063d0522\n'
            printf '\n## T94 update catalog alias (no APK rebuild, no protocol changes)\n'
            printf 'Exact same signed APK and SHA256 as original exp-buick-test-t94-20261031175159; no app source changes. Original built source branch: experiment/buick-b233-pcm-partial-read-continuity at the commit recorded above. The alias branch experiment/buick-test-t94-pcm-short-read descends from the identical signed code and adds only this publishing workflow, because already-installed Test updaters reject experiment/buick-b233-* sourceBranch values. Neither the original Release nor any stable/latest channel is changed.\n'
            printf '\n## B233 audio risk and parked-only acceptance\n'
            printf 'T94 only preserves PCM AudioRecord short reads with numeric telemetry; it does NOT incorporate draft PR #96-#100 or T90 highAccuracy. The original three T90 audible tests each ended with peer RTSP EOF around 20 seconds; T94 has not been vehicle tested and cannot claim to fix P0. The existing T94 build has known AAC first-frame and feedback logging privacy issues under separate draft fixes. Avoid personal media and do not upload raw logs; sanitize and explicitly consent before any diagnostics upload.\n'
            printf '\n## On-device experiment channel selection and rollback\n'
            printf 'Park vehicle, use Buick-Test app > Software Update > Experiment branch > choose project buick test t94 pcm short read > check selected branch > confirm download and Android system installer. This is a user-triggered install, never an automatic upgrade. Recheck video/touch/A2DP and audio capture permission; then measure actual audible CarPlay playback in three independent sessions >=3 minutes each with successful reconnect. Stop after a repeated ~20s EOF and preserve only privacy-reviewed evidence, do not repeatedly test an already failed version. Same Test package/signing key and higher versionCode than T91/T90; cannot in-place downgrade to a lower versionCode. Never uninstall/clear data for rollback; use an explicitly signed higher-code Test recovery if needed. Separate daily Buick-E5 remains unaffected.\n'
          } > release-notes.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target 1834fd9a05dfd7d19a29dba641ea38af063d0522 \
            --title "Buick-Test T94 软件更新实验目录兼容版 20261031175159" \
            --notes-file release-notes.txt --prerelease --latest=false
