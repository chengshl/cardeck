name: Build main and publish shared CarDeck latest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-main.yml'
      - '.github/workflows/build-shared-latest.yml'

# Serialize publication across ALL branches; preserve the most recently
# successful APK without cancelling a half-published release.
concurrency:
  group: cardeck-all-branches-latest
  cancel-in-progress: false

jobs:
  shared-build:
    permissions:
      contents: write
    uses: chengshl/cardeck/.github/workflows/build-shared-latest.yml@main
    secrets: inherit
