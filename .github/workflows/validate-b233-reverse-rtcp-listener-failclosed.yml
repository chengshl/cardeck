name: B233 Reverse RTCP Listener Fail-Closed Offline Regression
on:
  push:
    branches:
      - experiment/buick-b233-reverse-rtcp-listener-failclosed
    paths:
      - '.github/workflows/validate-b233-reverse-rtcp-listener-failclosed.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPortTest.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b233-reverse-rtcp-listener-failclosed
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Gate independent lifecycle-only changes against signed T88
        shell: bash
        run: |
          set -euo pipefail
          BASE=4eedb7f5c42bdddb3bb23a73146c10b42f29829f
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | while IFS= read -r path; do
            case "$path" in
              .github/workflows/validate-b233-reverse-rtcp-listener-failclosed.yml|app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt|app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPortTest.kt) ;;
              *) echo "::error::Out-of-scope change: $path"; exit 1 ;;
            esac
          done
          grep -Fq 'unexpectedReceiveExceptionFailsClosedAndAllowsFreshListener' app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPortTest.kt
          echo 'Listener lifecycle only: no AirPlayClient, SETUP, RTSP, RTP, iAP2, VPN, or updater changes.'
      - name: Android unit tests, lint and Kotlin compile (offline only)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:compileDebugKotlin --stacktrace
