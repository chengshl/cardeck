name: B233 sender metadata handoff ownership (offline)

on:
  push:
    branches:
      - experiment/buick-b233-sender-state-atomic-handoff-11
  pull_request:
    branches:
      - experiment/buick-b233-rtcp-live-owner-gate-11

permissions:
  contents: read
  actions: read

concurrency:
  group: b233-sender-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verified parent, old-race negative control and strict scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=91e1044b855132dd5c23f6ef51f0eb9dcedbd3aa
          test "$(git rev-parse "$BASE")" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41437265836 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41437265836 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-sender-metadata-handoff.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '91e1044b855132dd5c23f6ef51f0eb9dcedbd3aa'
          path = 'app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt'
          old = subprocess.check_output(['git', 'show', base + ':' + path], text=True)
          new = Path(path).read_text()
          def window(src):
              return src[src.index('    fun startAudioChannel('):src.index('    private fun attributeAudioTeardown()')]
          old, new = window(old), window(new)
          old_pub = old.index('            activeAudioProfile = profile')
          old_sender = old.index('            audioSender = sender')
          assert old_pub < old_sender, 'old metadata-first race not reproduced'
          assert 'synchronized(this@SessionController)' not in old, 'old callback already atomic'
          new_pub = new.index('                    audioSender = sender\n                    activeAudioProfile = profile')
          assert new.index('            callbackOwner.bind(sender)') < new_pub
          assert 'synchronized(this@SessionController) {\n                                    if (currentClient === client && callbackOwner.owns(audioSender)) {' in new
          assert 'if (!client.currentEndpoint.isBuickB233) {\n                activeAudioProfile = profile' in new
          assert '            } else {\n                audioSender = sender\n            }' in new
          assert new.index('                    audioSender = sender\n                    activeAudioProfile = profile') < new.index('            if (!sender.start(projection))')
          print('Old B233 metadata-before-sender handoff and unlocked stale callback reproduced; guarded publication/retirement present.')
          PY
      - name: Full Android JUnit, Lint and Debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 Draft only. No signing, Release, install, stable merge or network/volume changes.
