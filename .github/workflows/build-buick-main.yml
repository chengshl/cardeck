name: Build Buick-main upstream baseline APK

on:
  workflow_dispatch:
  push:
    branches: [Buick-main]

concurrency:
  group: buick-main-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Configure CARDECK_KEYSTORE_BASE64, CARDECK_KEYSTORE_PASSWORD, CARDECK_KEY_ALIAS."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-upload.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-upload.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-upload.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: Run upstream unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build signed baseline APK
        run: |
          set -euo pipefail
          export CARDECK_BUILD_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          echo "Building Buick-main: versionCode=$CARDECK_BUILD_VERSION_CODE"
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload baseline build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDeck-Buick-main
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish Buick-main test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/*.apk CarDeck-Buick-main.apk
          sha256sum CarDeck-Buick-main.apk > CarDeck-Buick-main.apk.sha256
          CODE=$((200000 + GITHUB_RUN_NUMBER))
          printf 'versionName=0.1.10-buick-main\nversionCode=%s\nbranch=Buick-main\ncommit=%s\nupstream=shaonialife/cardeck@3d23b3b\n\nBaseline only: Buick-E5 CarPlay/VPN fixes are not merged.\n' "$CODE" "$GITHUB_SHA" > release-notes.txt
          if gh release view buick-main-latest >/dev/null 2>&1; then
            gh release upload buick-main-latest CarDeck-Buick-main.apk CarDeck-Buick-main.apk.sha256 --clobber
            gh release edit buick-main-latest --notes-file release-notes.txt --prerelease
          else
            gh release create buick-main-latest CarDeck-Buick-main.apk CarDeck-Buick-main.apk.sha256 \
              --target "$GITHUB_SHA" --title "CarDeck Buick-main upstream baseline" \
              --notes-file release-notes.txt --prerelease
          fi
