name: T76 B233 AAC 诊断签名实验发布
on:
  push:
    branches:
      - experiment/buick-test-t76-aac-causality-observe
    paths:
      - '.github/workflows/publish-t76-aac-causality.yml'
  workflow_dispatch:
concurrency:
  group: publish-t76-aac-causality
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: 验证 Android 单元测试、Lint 和 Debug 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: 载入 Buick-Test 既有发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t76.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t76.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t76.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 设置版本号（大于旧 Test 取证安装版本）
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89035585
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: 构建原签名 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: 校验 Test 包名、版本、签名并与 T75 证书比对
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" | grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          "$APKSIGNER" verify "$APK"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$NEW_CERT"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi 'CN=Android Debug'; then
            echo "::error::检测到 Android Debug 签名，不发布"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/t75-reference"
          gh release download exp-buick-test-t75-20261026122056 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T75-RTCP-OBS.apk' \
            --dir "$RUNNER_TEMP/t75-reference"
          OLD_APK="$RUNNER_TEMP/t75-reference/CarDeck-Buick-Test-T75-RTCP-OBS.apk"
          "$APKSIGNER" verify "$OLD_APK"
          OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::新签名与原 T75 Test 发布证书不一致，不允许覆盖升级"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T76-AAC-TRACE.apk
          sha256sum CarDeck-Buick-Test-T76-AAC-TRACE.apk > CarDeck-Buick-Test-T76-AAC-TRACE.apk.sha256
          echo "T76 Test APK 包名/版本/签名连续性验证成功"
      - name: 上传签名 APK 和 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T76-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T76-AAC-TRACE.apk
            CarDeck-Buick-Test-T76-AAC-TRACE.apk.sha256
          if-no-files-found: error
      - name: 发布独立 T76 prerelease，不更改 stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t76-aac-causality-observe"
          TAG="exp-buick-test-t76-$CARDECK_RELEASE_VERSION_NAME"
          APK="CarDeck-Buick-Test-T76-AAC-TRACE.apk"
          test -s "$APK" && test -s "$APK.sha256"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T76 AAC 断连因果观测实验\n'
            printf '基于 T75，补充单调时间线及首次非零 PCM 后的短窗 AAC 明文自检。不修改 AAC/SETUP/RTP/RTCP 协议和原有清理行为。尚未完成实车验收，并非音频断连修复版本。\n'
            printf '\n## 安装风险\n'
            printf 'Test applicationId 与旧 Test 取证 App 相同，安装会覆盖旧取证程序。覆盖前先导出日志并停止采集。新独立 Rescue Standalone 包名不同，不会被覆盖。旧版本不能直接覆盖更新的 versionCode。\n'
          } > t76-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T76 音频因果诊断 $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t76-experiment-release.txt --prerelease --latest=false
