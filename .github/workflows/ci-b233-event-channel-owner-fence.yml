name: B233 event channel owner fence (offline)
on:
  push:
    branches:
      - experiment/buick-b233-event-channel-owner-fence-t94
  pull_request:
    branches:
      - experiment/buick-b233-rtsp-eof-route-retirement-t94
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact parent, scope and negative control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=465640147d5d3469ba8114aab67bfadd608052a3
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41316046939 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41316046939 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-event-channel-owner-fence.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233EventSocketConnection.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233EventSocketConnectionTest.kt' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          git show "$BASE":app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt > /tmp/parent.kt
          git show "$BASE":app/src/main/java/io/github/shaonialife/cardeck/airplay/B233EventSocketConnection.kt > /tmp/parent-owner.kt
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/parent.kt').read_text()
          new = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          owner_old = Path('/tmp/parent-owner.kt').read_text()
          owner_new = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/B233EventSocketConnection.kt').read_text()
          # Verified parent: old event reader can ACK via the newly published socket.
          assert 'val acked = respondEventRequest(cseq)' in old
          assert 'val acked = respondEventRequest(cseq, socket)' in new
          assert 'sourceSocket !== socket' in new
          assert 'eventCommandCipher !== cipher' in new
          assert 'b233EventSocketOwner.isCurrent(socket)' in new
          assert 'fun isCurrent(candidate: Socket)' not in owner_old
          assert 'fun isCurrent(candidate: Socket)' in owner_new
          assert 'eventCommandSocket !== socket' in new
          assert 'if (endpoint.isBuickB233 &&' in new
          print('Verified parent negative control and B233 event owner fencing')
          PY
      - name: Android JUnit, Lint and Debug
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 offline-only; no APK signing, release, installation or stable merge.
