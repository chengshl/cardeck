name: CarPlay feedback diagnostic privacy (offline)

on:
  pull_request:
    branches: [experiment/buick-b233-pcm-partial-read-continuity]
    paths:
      - '.github/workflows/ci-feedback-log-privacy.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioFeedbackLogPrivacyTest.kt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: audio-feedback-log-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Signed T94 ancestor, exact three-file scope and live feedback logging gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=1834fd9a05dfd7d19a29dba641ea38af063d0522
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41190133408 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41190133408 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/feedback-privacy-changed
          printf '%s\n' '.github/workflows/ci-feedback-log-privacy.yml' 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' 'app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioFeedbackLogPrivacyTest.kt' > /tmp/feedback-privacy-expected
          diff -u /tmp/feedback-privacy-expected /tmp/feedback-privacy-changed
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioFeedbackLogPrivacyTest.kt').read_text()
          live = src.split('private fun logFeedbackBody(body: ByteArray)', 1)[1].split('/** 心跳线程', 1)[0]
          helper = src.split('internal fun safeAudioFeedbackLogLines(body: ByteArray)', 1)[1].split('/**\n * AirPlay 客户端', 1)[0]
          assert 'safeAudioFeedbackLogLines(body).forEach(log)' in live
          assert 'logFeedbackBody(body)' in src.split('fun startFeedbackLoop()', 1)[1].split('private fun logFeedbackBody', 1)[0]
          for banned in ('joinToString', 'streamConnectionID', '全字段', 'hex=', 'root.keys', 'log('):
              assert banned not in helper and banned not in live, banned
          assert 'streams.take(8)' in helper
          for key in ('"type"', '"sr"', '"sampleTime"', '"timestamp"', '"timestampRawNs"'):
              assert key in helper
          for case in ('validClockRemainsVisibleWithoutIdentifiersOrUnknownFields',
                       'malformedPayloadNeverDumpsHexOrRawBytes',
                       'missingStreamsDoesNotExposeRootKeysOrValues',
                       'malformedFieldsNeverUseArbitraryToString',
                       'excessiveStreamsAreBoundedAndNoUnknownPayloadIsLogged'):
              assert case in tests
          PY
      - name: Feedback privacy negative JVM regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.AudioFeedbackLogPrivacyTest --stacktrace
      - name: Full Android JUnit, Lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# Offline only: no signing, release, installation, stable merge or vehicle acceptance.
