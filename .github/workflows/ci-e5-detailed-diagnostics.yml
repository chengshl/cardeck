name: E5 detailed diagnostics PR verification
on:
  # The PR workflow is not present on the older E5 base, so provide a
  # branch-local exact-HEAD gate for the existing L3 diagnostics candidate.
  push:
    branches: [experiment/buick-e5-detailed-diagnostics]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/ci-e5-detailed-diagnostics.yml'
      - '.github/workflows/publish-e5-detailed-diagnostics.yml'
  pull_request:
    branches:
      - Buick-E5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e5-diagnostics-head-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail closed on accidental signed-release triggers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/publish-e5-detailed-diagnostics.yml')
          content = path.read_text()
          push = content.split('on:\n  push:\n', 1)[1].split('  workflow_dispatch:', 1)[0]
          expected = {
              'app/src/main/**', 'app/src/release/**',
              'app/build.gradle.kts', 'app/proguard-rules.pro',
              'build.gradle.kts', 'settings.gradle.kts',
              'gradle.properties', 'gradle/**', 'gradlew', 'gradlew.bat',
          }
          assert 'paths-ignore:' not in push
          assert '    paths:\n' in push
          actual = {line.strip()[3:-1] for line in push.splitlines()
                    if line.strip().startswith("- '") and line.strip().endswith("'")}
          assert actual == expected, (actual, expected)
          assert 'group: cardeck-global-signed-release-version' in content
          assert 'cancel-in-progress: false' in content
          assert '  workflow_dispatch:' in content
          print('Workflow/test/docs-only pushes cannot auto-sign; manual dispatch preserved')
          PY
      - name: Unit tests and debug compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
