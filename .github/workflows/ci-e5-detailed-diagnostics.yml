name: E5 detailed diagnostics PR verification
on:
  # The PR workflow is not present on the older E5 base, so provide a
  # branch-local exact-HEAD gate for the existing L3 diagnostics candidate.
  push:
    branches: [experiment/buick-e5-detailed-diagnostics]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/ci-e5-detailed-diagnostics.yml'
      - '.github/workflows/publish-e5-detailed-diagnostics.yml'
  pull_request:
    branches:
      - Buick-E5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e5-diagnostics-head-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail closed on signing, versioning and experiment provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          content = Path('.github/workflows/publish-e5-detailed-diagnostics.yml').read_text()
          # This L3 Draft may never auto-publish on a source or test push.
          assert 'on:\\n  workflow_dispatch:\\n' in content
          assert '\\n  push:\\n' not in content
          assert 'group: cardeck-global-signed-release-version' in content
          assert 'cancel-in-progress: false' in content
          assert 'python3 tools/release/allocate_version.py' in content
          assert 'BUILD_EPOCH' not in content
          assert 'gh release download buick-e5-latest' in content
          assert 'NEW_CERT' in content and 'OLD_CERT' in content
          assert 'versionCode=' in content and 'versionName=' in content
          assert 'TAG="exp-buick-e5-detailed-diagnostics-$CARDECK_RELEASE_VERSION_NAME"' in content
          assert 'sourceBranch=%s' in content and 'baseBranch=Buick-E5' in content
          assert 'artifactKind=experiment' in content and 'updaterSchema=2' in content
          assert 'test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"' in content
          blob = subprocess.check_output(
              ['git', 'hash-object', 'tools/release/allocate_version.py'], text=True).strip()
          assert blob == 'eec664befa9a2efd5a030d7ae49fc69096c4a452', blob
          print('Manual-only, global allocator, official E5 certificate, provenance and release tag gates passed')
          PY
      - name: Global version allocator regression tests
        run: python3 -m unittest discover -s tools/release -p 'test_allocate_version.py' -v
      - name: Unit tests and debug compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
