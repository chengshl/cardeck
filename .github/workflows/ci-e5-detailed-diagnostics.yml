name: E5 detailed diagnostics PR verification
on:
  # The PR workflow is not present on the older E5 base, so provide a
  # branch-local exact-HEAD gate for the existing L3 diagnostics candidate.
  push:
    branches: [experiment/buick-e5-detailed-diagnostics]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'tools/gateway/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/ci-e5-detailed-diagnostics.yml'
      - '.github/workflows/publish-e5-detailed-diagnostics.yml'
  pull_request:
    branches:
      - Buick-E5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e5-diagnostics-head-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail closed on signing, versioning and experiment provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          content = Path('.github/workflows/publish-e5-detailed-diagnostics.yml').read_text()
          # This L3 Draft may never auto-publish on a source or test push.
          assert 'on:\n  workflow_dispatch:\n' in content
          assert '\n  push:\n' not in content
          assert 'group: cardeck-global-signed-release-version' in content
          assert 'cancel-in-progress: false' in content
          assert 'python3 tools/release/allocate_version.py' in content
          assert 'BUILD_EPOCH' not in content
          assert 'gh release download buick-e5-latest' in content
          assert 'NEW_CERT' in content and 'OLD_CERT' in content
          assert 'versionCode=' in content and 'versionName=' in content
          assert 'TAG="exp-buick-e5-detailed-diagnostics-$CARDECK_RELEASE_VERSION_NAME"' in content
          assert 'sourceBranch=%s' in content and 'baseBranch=Buick-E5' in content
          assert 'artifactKind=experiment' in content and 'updaterSchema=2' in content
          assert 'test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"' in content
          blob = subprocess.check_output(
              ['git', 'hash-object', 'tools/release/allocate_version.py'], text=True).strip()
          assert blob == 'eec664befa9a2efd5a030d7ae49fc69096c4a452', blob
          print('Manual-only, global allocator, official E5 certificate, provenance and release tag gates passed')
          PY
      - name: Enforce scoped long-log delta and E5 source lease
        run: |
          python3 - <<'PY'
          import os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          baseline='d0831ea8ec11c3ad50df7a3d273e6d5881f1b132'
          candidate=git('rev-parse','HEAD^2' if os.environ.get('GITHUB_EVENT_NAME')=='pull_request' else 'HEAD')
          assert git('rev-parse','origin/Buick-E5')=='550f30272f3545f76650478788155ba1374fdc5e'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,candidate],check=True)
          changed=set(git('diff','--name-only',baseline,candidate).splitlines())
          allowed={'app/src/test/java/io/github/shaonialife/cardeck/gateway/ForensicRedactionTest.kt', 'tools/gateway/test_long_logs.py', '.github/workflows/ci-e5-detailed-diagnostics.yml', 'tools/gateway/gateway.py', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/LogRedactorTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/CrashEvidenceSelectorTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/GatewayProbeTest.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/LogRedactor.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayLogProtocol.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/GatewayLongLogTest.kt', 'docs/UNIFIED-LONG-LOGS.md', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayLogBuffer.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/RebootEvidenceCapture.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/DetailedDiagnosticSelector.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/CrashEvidenceSelector.kt', 'tools/gateway/log_archive.py', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayProbe.kt', 'app/build.gradle.kts', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/CombinedDiagnosticSelector.kt'}
          assert changed==allowed, f'Unreviewed long-log delta: {sorted(changed ^ allowed)}'
          subprocess.run(['git','checkout','--detach',candidate],check=True)
          print('Exact diagnostics candidate; no CarPlay, signing or stable-source changes')
          PY
      - name: Global version allocator regression tests
        run: python3 -m unittest discover -s tools/release -p 'test_allocate_version.py' -v
      - name: Unit tests and debug compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - name: Long-log transport and durable archive regression
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/gateway/requirements.txt
          python3 -m unittest discover -s tools/gateway -p 'test_log_archive.py' -v
          python3 tools/gateway/test_gateway.py
          python3 tools/gateway/test_long_logs.py
      - uses: actions/upload-artifact@v4
        with:
          name: e5-long-log-debug-and-test-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
          retention-days: 7
