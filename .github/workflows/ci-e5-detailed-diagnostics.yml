name: E5 detailed diagnostics PR verification
on:
  # The PR workflow is not present on the older E5 base, so provide a
  # branch-local exact-HEAD gate for the existing L3 diagnostics candidate.
  push:
    branches: [experiment/buick-e5-detailed-diagnostics]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'tools/gateway/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/ci-e5-detailed-diagnostics.yml'
      - '.github/workflows/publish-e5-detailed-diagnostics.yml'
  pull_request:
    branches:
      - Buick-E5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e5-diagnostics-head-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail closed on signing, versioning and experiment provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          content = Path('.github/workflows/publish-e5-detailed-diagnostics.yml').read_text()
          # This L3 Draft may never auto-publish on a source or test push.
          assert 'on:\n  workflow_dispatch:\n' in content
          assert '\n  push:\n' not in content
          assert 'group: cardeck-global-signed-release-version' in content
          assert 'cancel-in-progress: false' in content
          assert 'python3 tools/release/allocate_version.py' in content
          assert 'BUILD_EPOCH' not in content
          assert 'gh release download buick-e5-latest' in content
          assert 'NEW_CERT' in content and 'OLD_CERT' in content
          assert 'versionCode=' in content and 'versionName=' in content
          assert 'TAG="exp-buick-e5-detailed-diagnostics-$CARDECK_RELEASE_VERSION_NAME"' in content
          assert 'sourceBranch=%s' in content and 'baseBranch=Buick-E5' in content
          assert 'artifactKind=experiment' in content and 'updaterSchema=2' in content
          assert 'test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"' in content
          blob = subprocess.check_output(
              ['git', 'hash-object', 'tools/release/allocate_version.py'], text=True).strip()
          assert blob == 'eec664befa9a2efd5a030d7ae49fc69096c4a452', blob
          print('Manual-only, global allocator, official E5 certificate, provenance and release tag gates passed')
          PY
      - name: Enforce scoped long-log delta and E5 source lease
        run: |
          python3 - <<'PY'
          import os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          # The diagnostics PR now carries the reviewed E5 head as its second
          # parent. Compare against E5, not the obsolete pre-updater baseline.
          stable='550f30272f3545f76650478788155ba1374fdc5e'
          candidate=git('rev-parse','HEAD^2' if os.environ.get('GITHUB_EVENT_NAME')=='pull_request' else 'HEAD')
          assert git('rev-parse','origin/Buick-E5')==stable, 'E5 moved; re-review required'
          subprocess.run(['git','merge-base','--is-ancestor',stable,candidate],check=True)
          expected={'.github/workflows/ci-e5-detailed-diagnostics.yml', '.github/workflows/publish-e5-detailed-diagnostics.yml', 'app/build.gradle.kts', 'app/src/main/AndroidManifest.xml', 'app/src/main/java/io/github/shaonialife/cardeck/EntryConfigActivity.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/CombinedDiagnosticSelector.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/CrashEvidenceSelector.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/DetailedDiagnosticSelector.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/DiagnosticPreviewSummary.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayLogBuffer.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayLogProtocol.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayProbe.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/LogRedactor.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/OfflineDiagnosticExporter.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/RebootEvidenceCapture.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/RescueTracePolicy.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/RescueTraceStore.kt', 'app/src/main/java/io/github/shaonialife/cardeck/gateway/SystemLogCapture.kt', 'app/src/main/java/io/github/shaonialife/cardeck/service/RescueTraceService.kt', 'app/src/main/java/io/github/shaonialife/cardeck/ui/DiagnosticPreviewDialog.kt', 'app/src/main/java/io/github/shaonialife/cardeck/update/UpdateAutoCheck.kt', 'app/src/main/res/layout/activity_entry_config.xml', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/CrashEvidenceSelectorTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/DetailedDiagnosticSelectorTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/ForensicRedactionTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/GatewayLongLogTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/GatewayProbeTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/LogRedactorTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/gateway/RescueTracePolicyTest.kt', 'app/src/test/java/io/github/shaonialife/cardeck/update/UpdateAutoCheckTest.kt', 'docs/UNIFIED-LONG-LOGS.md', 'tools/gateway/gateway.py', 'tools/gateway/log_archive.py', 'tools/gateway/test_long_logs.py'}
          expected.update(["app/src/main/java/io/github/shaonialife/cardeck/config/EntryConfig.kt","app/src/main/java/io/github/shaonialife/cardeck/service/GatewayLogService.kt","app/src/test/java/io/github/shaonialife/cardeck/config/EntryAddressTest.kt"])
          expected.update(["app/src/main/java/io/github/shaonialife/cardeck/gateway/OfflineLogFormatter.kt","app/src/main/java/io/github/shaonialife/cardeck/service/RescueTraceService.kt","app/src/test/java/io/github/shaonialife/cardeck/gateway/ForensicRedactionTest.kt"])
          expected.update(["app/src/main/res/values/entry_config_strings.xml"])
          changed=set(git('diff','--name-only',stable,candidate).splitlines())
          assert changed==expected, f'Unexpected E5 runtime delta: {sorted(changed ^ expected)}'
          assert git('rev-parse',candidate+':tools/release/allocate_version.py') == git('rev-parse',stable+':tools/release/allocate_version.py')
          subprocess.run(['git','checkout','--detach',candidate],check=True)
          print('PASS: current E5 is an ancestor; only reviewed diagnostics files differ')
          PY
      - name: Global version allocator regression tests
        run: python3 -m unittest discover -s tools/release -p 'test_allocate_version.py' -v
      - name: Unit tests and debug compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Full Android Lint report with strict changed-file error gate
        run: |
          # Existing virtual-display WrongConstant lint errors are outside
          # this isolated diagnostics delta; do not change Shizuku behavior.
          ./gradlew :app:lintDebug --continue || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET
          report = Path('app/build/reports/lint-results-debug.xml')
          assert report.is_file(), 'No Lint XML generated'
          baseline = 'd0831ea8ec11c3ad50df7a3d273e6d5881f1b132'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', baseline, 'HEAD'], text=True
          ).splitlines())
          source_paths = {f for f in changed if f.startswith('app/src/')}
          errors, touched = [], []
          for issue in ET.parse(report).getroot().findall('issue'):
              if issue.get('severity') != 'Error':
                  continue
              code = issue.get('id', 'unknown')
              paths = [str(loc.get('file', '')).replace('\\', '/')
                       for loc in issue.findall('location')]
              errors.append((code, paths))
              if any(path.endswith('/' + changed_path)
                     for path in paths for changed_path in source_paths):
                  touched.append((code, paths))
          print(f'Full Lint errors: {len(errors)}; changed-source errors: {len(touched)}')
          for code, paths in errors[:30]:
              print(f'Lint error {code}: {paths}')
          assert not touched, f'Changed diagnostics source has lint errors: {touched}'
          print('PASS: no Lint errors in changed diagnostics source; inherited full-project errors remain visible')
          PY
      - name: Long-log transport and durable archive regression
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/gateway/requirements.txt
          python3 -m unittest discover -s tools/gateway -p 'test_log_archive.py' -v
          python3 tools/gateway/test_gateway.py
          python3 tools/gateway/test_long_logs.py
      - uses: actions/upload-artifact@v4
        with:
          name: e5-long-log-debug-and-test-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/
          retention-days: 7
