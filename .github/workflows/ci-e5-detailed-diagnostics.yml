name: E5 detailed diagnostics PR verification
on:
  pull_request:
    branches:
      - Buick-E5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e5-diagnostics-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
