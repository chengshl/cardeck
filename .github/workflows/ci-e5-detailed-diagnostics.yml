name: E5 detailed diagnostics PR verification
on:
  # The PR workflow is not present on the older E5 base, so provide a
  # branch-local exact-HEAD gate for the existing L3 diagnostics candidate.
  push:
    branches: [experiment/buick-e5-detailed-diagnostics]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/ci-e5-detailed-diagnostics.yml'
      - '.github/workflows/publish-e5-detailed-diagnostics.yml'
  pull_request:
    branches:
      - Buick-E5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e5-diagnostics-head-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Fail closed on signing, versioning and experiment provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          content = Path('.github/workflows/publish-e5-detailed-diagnostics.yml').read_text()
          # This L3 Draft may never auto-publish on a source or test push.
          assert 'on:\n  workflow_dispatch:\n' in content
          assert '\n  push:\n' not in content
          assert 'group: cardeck-global-signed-release-version' in content
          assert 'cancel-in-progress: false' in content
          assert 'python3 tools/release/allocate_version.py' in content
          assert 'BUILD_EPOCH' not in content
          assert 'gh release download buick-e5-latest' in content
          assert 'NEW_CERT' in content and 'OLD_CERT' in content
          assert 'versionCode=' in content and 'versionName=' in content
          assert 'TAG="exp-buick-e5-detailed-diagnostics-$CARDECK_RELEASE_VERSION_NAME"' in content
          assert 'sourceBranch=%s' in content and 'baseBranch=Buick-E5' in content
          assert 'artifactKind=experiment' in content and 'updaterSchema=2' in content
          assert 'test "$SOURCE_BRANCH" = "$GITHUB_REF_NAME"' in content
          blob = subprocess.check_output(
              ['git', 'hash-object', 'tools/release/allocate_version.py'], text=True).strip()
          assert blob == 'eec664befa9a2efd5a030d7ae49fc69096c4a452', blob
          print('Manual-only, global allocator, official E5 certificate, provenance and release tag gates passed')
          PY
      - name: Enforce automatic installed-version diagnostic provenance
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          reviewed = 'c276cc69b2eacf2c9dc2be35c31f2827748b6484'
          runtime = 'app/src/main/java/io/github/shaonialife/cardeck/gateway/GatewayProbe.kt'
          test = 'app/src/test/java/io/github/shaonialife/cardeck/gateway/GatewayProbeTest.kt'
          workflow = '.github/workflows/ci-e5-detailed-diagnostics.yml'
          candidate = git('rev-parse', 'HEAD^2' if os.environ.get('GITHUB_EVENT_NAME') == 'pull_request' else 'HEAD')
          assert git('rev-parse', 'origin/Buick-E5') == '5e565a08b228d157ff1d739f38b8c09fad80f8a5'
          changed = set(git('diff', '--name-only', reviewed, candidate).splitlines())
          assert changed == {runtime, test, workflow}, f'Unreviewed #30 files: {sorted(changed)}'

          baseline = git('show', f'{reviewed}:{runtime}')
          actual = git('show', f'{candidate}:{runtime}')
          before_import = 'import io.github.shaonialife.cardeck.config.EntryAddress'
          after_import = 'import io.github.shaonialife.cardeck.BuildConfig\\n' + before_import
          before_start = '        if (started || stopped) return\\n        started = true\\n        val request = runCatching {'
          after_start = (
              '        if (started || stopped) return\\n'
              '        started = true\\n'
              '        // The Gateway registration already reports VERSION_NAME; the app log\\n'
              "        // includes the installed APK's integer code without changing the wire\\n"
              '        // schema or requiring the user to run ADB for routine diagnostics.\\n'
              '        if (deviceInfo != null) {\\n'
              '            appLogs?.offer("APP_BUILD: installedVersionCode=${BuildConfig.VERSION_CODE}")\\n'
              '        }\\n'
              '        val request = runCatching {'
          )
          # Decode the explicit source newlines and keep Kotlin interpolation literal.
          after_import = after_import.replace('\\n', chr(10))
          before_start = before_start.replace('\\n', chr(10))
          after_start = after_start.replace('\\n', chr(10))
          assert baseline.count(before_import) == 1 and baseline.count(before_start) == 1
          expected = baseline.replace(before_import, after_import).replace(before_start, after_start)
          assert actual == expected, 'Unreviewed Gateway transport / authentication behavior changed'
          assert 'sendReportMessage(deviceInfo!!.registration())' in actual
          assert 'if (logsSupported) logPump =' in actual
          assert 'appLogs?.offer("APP_BUILD: installedVersionCode=' in actual

          reviewed_test = git('show', 'f133ed995a6b1216d47c7d86f0bc280e93aa69d3:' + test)
          assert git('show', f'{candidate}:{test}') == reviewed_test, 'Gateway version assertion tests drifted'
          print('Gateway registration unchanged; installed build version logged via existing app-log channel')
          PY
      - name: Global version allocator regression tests
        run: python3 -m unittest discover -s tools/release -p 'test_allocate_version.py' -v
      - name: Unit tests and debug compilation
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
