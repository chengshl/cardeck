name: T83 B233 Unnegotiated Audio Resource Fallback Signed
on:
  push:
    branches:
      - experiment/buick-test-t76-aac-causality-observe
    paths:
      - '.github/workflows/publish-t83-audio-resource-fallback.yml'
  workflow_dispatch:
concurrency:
  group: publish-t83-audio-resource-fallback
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  signed-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: B233 unnegotiated audio resource scope lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 3e1a05c33d2129c1152e9369b1a2cb79b56e2ac2
          CHANGED="$(git diff --name-only 3e1a05c33d2129c1152e9369b1a2cb79b56e2ac2 HEAD)"
          printf '%s\n' "$CHANGED"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/publish-t83-audio-resource-fallback\.yml|app/src/main/java/io/github/shaonialife/cardeck/(SessionController|airplay/(AirPlayClient|AirPlayModeClaims|ModeTransactionEvidence))\.kt|app/src/test/java/io/github/shaonialife/cardeck/airplay/(AirPlayModeClaimsTest|ModeTransactionEvidenceTest)\.kt)$' || true)"
          test -z "$BAD" || { echo "::error::Unexpected unrelated diff: $BAD"; exit 1; }
          grep -Fq 'releaseB233UnnegotiatedAudioClaim' app/src/main/java/io/github/shaonialife/cardeck/SessionController.kt
          grep -Fq 'audioSetupMayHaveCreatedStream = true' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt
          grep -Fq 'shouldReleaseUnnegotiatedAudioClaim' app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayModeClaims.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/AirPlayModeClaimsTest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/ModeTransactionEvidenceTest.kt
      - name: 验证 Android 单元测试、Lint 和 Debug 编译
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: 载入 Buick-Test 既有发布签名
        env:
          KEYSTORE_B64: ${{ secrets.CARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CARDECK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cardeck-t83.p12"
          chmod 600 "$RUNNER_TEMP/cardeck-t83.p12"
          {
            echo "storeFile=$RUNNER_TEMP/cardeck-t83.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
      - name: 设置严格大于 T82 的新版本码
        shell: bash
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          BUILD_CODE=$(( BUILD_EPOCH - 1704067200 ))
          test "$BUILD_CODE" -gt 89101901
          echo "CARDECK_BUILD_VERSION_CODE=$BUILD_CODE" >> "$GITHUB_ENV"
          echo "CARDECK_RELEASE_VERSION_NAME=$(TZ=Asia/Shanghai date -d "@$BUILD_EPOCH" +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: 构建原签名 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: 校验 Test 包名、版本、签名并与 T75 证书比对
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='io.github.buick.test.cardeck'" | grep -F "versionCode='$CARDECK_BUILD_VERSION_CODE'" | grep -F "versionName='$CARDECK_RELEASE_VERSION_NAME'"
          test -s app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequest.kt
          test -s app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioRetransmitRequestTest.kt
          grep -Fq "selectedProject" app/src/main/java/io/github/shaonialife/cardeck/update/ExperimentalUpdates.kt
          grep -Fq "chooseProject" app/src/main/java/io/github/shaonialife/cardeck/UpdateCenterActivity.kt
          grep -Fq 'reverse_audio_resend_request' app/src/main/java/io/github/shaonialife/cardeck/airplay/AudioReverseControlPort.kt
          grep -Fq 'sentPacketCountSnapshot' app/src/main/java/io/github/shaonialife/cardeck/audio/AudioSender.kt
          echo "开始验证新签名 APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/t83-cert-details.txt"
          NEW_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t83-cert-details.txt" | head -n 1)"
          if [ -z "$NEW_CERT" ]; then
            echo "::error::已通过基础签名检查，但未找到证书 SHA-256 信息；停止发布"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/t83-cert-details.txt"; then
            echo "::error::检测到 Android Debug 签名，不发布"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/t75-reference"
          gh release download exp-buick-test-t75-20261026122056 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarDeck-Buick-Test-T75-RTCP-OBS.apk' \
            --dir "$RUNNER_TEMP/t75-reference"
          OLD_APK="$RUNNER_TEMP/t75-reference/CarDeck-Buick-Test-T75-RTCP-OBS.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" | tee "$RUNNER_TEMP/t75-cert-details.txt"
          OLD_CERT="$(sed -nE 's/.*[Cc]ertificate SHA-256 digest: *([[:xdigit:]]+).*/\1/p' "$RUNNER_TEMP/t75-cert-details.txt" | head -n 1)"
          if [ -z "$OLD_CERT" ]; then
            echo "::error::旧版 T75 证书摘要无法解析，停止发布"
            exit 1
          fi
          test "$NEW_CERT" = "$OLD_CERT" || {
            echo "::error::新签名与原 T75 Test 发布证书不一致，不允许覆盖升级"
            exit 1
          }
          cp "$APK" CarDeck-Buick-Test-T83-AUDIO-RESOURCE-FALLBACK.apk
          sha256sum CarDeck-Buick-Test-T83-AUDIO-RESOURCE-FALLBACK.apk > CarDeck-Buick-Test-T83-AUDIO-RESOURCE-FALLBACK.apk.sha256
          echo "T83 Test APK 包名/版本/签名连续性验证成功"
      - name: 上传签名 APK 和 SHA256
        uses: actions/upload-artifact@v4
        with:
          name: Buick-Test-T83-SIGNED-${{ github.run_id }}
          path: |
            CarDeck-Buick-Test-T83-AUDIO-RESOURCE-FALLBACK.apk
            CarDeck-Buick-Test-T83-AUDIO-RESOURCE-FALLBACK.apk.sha256
          if-no-files-found: error
      - name: 发布独立 T83 音频资源回退实验 prerelease，不更改 stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/buick-test-t76-aac-causality-observe"
          TAG="exp-buick-test-t83-$CARDECK_RELEASE_VERSION_NAME"
          APK="CarDeck-Buick-Test-T83-AUDIO-RESOURCE-FALLBACK.apk"
          test -s "$APK" && test -s "$APK.sha256"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'artifactKind=experiment\nupdaterSchema=2\nbaseBranch=Buick-Test\nsourceBranch=%s\napplicationId=io.github.buick.test.cardeck\nversionName=%s\nversionCode=%s\nbuiltAt=%s\napkName=%s\ncommit=%s\n' \
              "$GITHUB_REF_NAME" "$CARDECK_RELEASE_VERSION_NAME" "$CARDECK_BUILD_VERSION_CODE" "$BUILT_AT" "$APK" "$GITHUB_SHA"
            printf '\n## T83：B233音频SETUP未成立时的主音频资源回退（L3）\n'
            printf '只在B233当前有效视频会话中、已尝试全部音频候选但没有确认或结果不确定的音频SETUP时，重新声明只持有主屏，保留普通蓝牙A2DP。若车机曾返回SETUP 200，或请求超时、网络错误导致结果不确定，则绝不擅自撤回音频资源。暂缺投屏权限的晚授权场景不归类为终态失败。不会改变已正常建立的AAC/PCM音频、RTP、RTCP、反馈、changeModes请求格式及重连逻辑。此版仅验证一种明确的生命周期残留，不是正常音频起流后约20秒RTSP EOF的修复，尚未经实车验收。\n'
            printf '\n## 安装与回退风险\n'
            printf '沿用Test applicationId及已验证的同一发布签名；覆盖旧Test安装并保留现有数据。版本码递增，不能直接用旧版APK降级覆盖。使用前先导出本机必要记录。独立其他包名不会被覆盖。不开启并发双应用CarPlay连接，避免会话争用。\n'
          } > t83-experiment-release.txt
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Buick-Test T83 Audio Resource Fallback $CARDECK_RELEASE_VERSION_NAME" \
            --notes-file t83-experiment-release.txt --prerelease --latest=false
