name: T95 B233 modesChanged reply and audio diagnostic privacy (offline)

on:
  pull_request:
    branches: [experiment/buick-b233-pcm-partial-read-continuity]
    paths:
      - '.github/workflows/ci-t95-mode-reply-privacy.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummary.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummaryTest.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioFeedbackLogPrivacyTest.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/audio/AacLcEncoder.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/audio/AacFirstFrameLogPrivacyTest.kt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: t95-mode-reply-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact signed T94 ancestor, seven-file scope and runtime privacy wiring
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=1834fd9a05dfd7d19a29dba641ea38af063d0522
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41190133408 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41190133408 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41190137017 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41190137017 --jq .conclusion)" = success
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort > /tmp/t95-scope
          printf '%s\n' \
            '.github/workflows/ci-t95-mode-reply-privacy.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummary.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/audio/AacLcEncoder.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/AudioFeedbackLogPrivacyTest.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummaryTest.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/audio/AacFirstFrameLogPrivacyTest.kt' > /tmp/t95-expected
          diff -u /tmp/t95-expected /tmp/t95-scope
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          air = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          mode = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ModeReplySummary.kt').read_text()
          aac = Path('app/src/main/java/io/github/shaonialife/cardeck/audio/AacLcEncoder.kt').read_text()
          assert 'val (statusLine, replyBody)' in air.split('fun assertModes(',1)[1].split('fun initialSetup',1)[0]
          assert 'B233ModeReplySummary.describe(replyBody)' in air
          assert 'ownership=unverified' in mode and 'MAX_PLIST_BYTES = 4096' in mode
          assert 'safeAudioFeedbackLogLines(body).forEach(log)' in air
          setup = air.split('fun runAudioStream(', 1)[1].split('fun teardownAudioStream(', 1)[0]
          assert 'B233AudioSetupLog.rejected(streams.size)' in setup
          assert 'B233AudioSetupLog.missingDataPort()' in setup
          assert 'B233AudioSetupLog.safePorts(dataPort, portOf(audio["controlPort"]), reversePort)' in setup
          assert 'if (endpoint.isBuickB233)' in setup
          assert 'internal object B233AudioSetupLog' in air
          assert 'feedback body 解析失败（${body.size}B）hex=' not in air
          assert 'connId=${stream["streamConnectionID"]}' not in air
          assert 'firstAacFrameSafeLog(out, raw, wrapAdts)' in aac
          assert 'head=$head' not in aac
          assert 'channel.suppressSensitiveRawFrames()' in Path('app/src/main/java/io/github/shaonialife/cardeck/iap2/Iap2SenderSession.kt').read_text()
          PY
      - name: B233 reply evidence and private audio logs JVM regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.B233ModeReplySummaryTest --tests io.github.shaonialife.cardeck.airplay.AudioFeedbackLogPrivacyTest --tests io.github.shaonialife.cardeck.audio.AacFirstFrameLogPrivacyTest --stacktrace
      - name: Full Android JUnit, Lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 Draft only. No signing, release, installation, stable merge or real-car acceptance.
