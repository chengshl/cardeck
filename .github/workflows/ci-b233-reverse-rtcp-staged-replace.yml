name: B233 reverse RTCP staged replacement (offline)
on:
  push:
    branches:
      - experiment/buick-b233-rtcp-replace-after-bind-11
  pull_request:
    branches:
      - experiment/buick-b233-audio-preflight-preserve-port-t94
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-rtcp-staged-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact verified parent, strict scope and negative control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=9878e9a3ea1f5b7ffe3a8d31256ce12729a0d655
          test "$(git rev-parse "$BASE")" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41420739615 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41420739615 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/ci-b233-reverse-rtcp-staged-replace.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/ReverseAudioPortOwnershipTest.kt' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = '9878e9a3ea1f5b7ffe3a8d31256ce12729a0d655'
          source = 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
          tests = 'app/src/test/java/io/github/shaonialife/cardeck/airplay/ReverseAudioPortOwnershipTest.kt'
          old = subprocess.check_output(['git', 'show', base + ':' + source], text=True)
          new = Path(source).read_text()
          old_tests = subprocess.check_output(['git', 'show', base + ':' + tests], text=True)
          new_tests = Path(tests).read_text()
          assert '        closeReverseAudioControlPort()\n        val reversePort =' in old
          assert 'installReadyReverseAudioPort' not in old
          assert 'failedReversePortBindPreservesActiveListenerUntilReplacementIsReady' not in old_tests
          assert 'failedReversePortBindPreservesActiveListenerUntilReplacementIsReady' in new_tests
          start = new.index('    fun runAudioStream(')
          end = new.index('    private fun probeAndFixVolume(', start)
          section = new[start:end]
          guard = section.index('if (!endpoint.isBuickB233 || !needsReversePort) closeReverseAudioControlPort()')
          start_port = section.index('val port = reverse.start()')
          install = section.index('reverseAudioControlPort = installReadyReverseAudioPort(')
          assert guard < start_port < install
          assert 'if (reverse.port == 0)' in section[start_port:install]
          assert 'audioRtpSentCountProvider = null' in section[install:install+300]
          assert '        closeReverseAudioControlPort()\n        val reversePort =' not in section
          delta = subprocess.check_output(['git','diff','--unified=0',base,'HEAD','--',source],text=True)
          assert delta.count('\n@@') == 3, 'unexpected production hunks'
          print('Old B233 pre-bind retirement reproduced; new source preserves previous listener on bind failure.')
          PY
      - name: Full Android JUnit, Lint and Debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 Draft only. No signing, Release, install, stable merge or user-network change.
