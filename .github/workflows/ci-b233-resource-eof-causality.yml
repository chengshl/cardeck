name: B233 audio resource and peer EOF causality (offline only)
on:
  pull_request:
    branches: [experiment/buick-test-safe-audio-preflight-integration]
    paths:
      - '.github/workflows/ci-b233-resource-eof-causality.yml'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt'
      - 'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ResourceEofEvidence.kt'
      - 'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ResourceEofEvidenceTest.kt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b233-resource-eof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Exact privacy-hardened base and four-file read-only scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=feb9e6abddeed4283a02fb68a4f94ab78c1b427c
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41229396692 --jq .head_sha)" = "$BASE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41229396692 --jq .conclusion)" = success
          git diff --name-only "$BASE" HEAD | sort > /tmp/scope
          printf '%s\n' \
            '.github/workflows/ci-b233-resource-eof-causality.yml' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt' \
            'app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ResourceEofEvidence.kt' \
            'app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ResourceEofEvidenceTest.kt' > /tmp/expected
          diff -u /tmp/expected /tmp/scope
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          from pathlib import Path
          air = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/AirPlayClient.kt').read_text()
          helper = Path('app/src/main/java/io/github/shaonialife/cardeck/airplay/B233ResourceEofEvidence.kt').read_text()
          tests = Path('app/src/test/java/io/github/shaonialife/cardeck/airplay/B233ResourceEofEvidenceTest.kt').read_text()
          assert 'b233ResourceEofEvidence.receiverChangeModes(command)' in air
          assert 'if (endpoint.isBuickB233 && claimAudioResource)' in air
          assert 'b233ResourceEofEvidence.claimMainAudio(SystemClock.uptimeMillis())' in air
          assert 'b233ResourceEofEvidence.claimReply(it, statusLine, replyBody.isNotEmpty())' in air
          assert 'b233ResourceEofEvidence.claimIoError(it)' in air
          assert 'generation != claimGeneration' in helper
          assert 'lateSuccessFromPreviousRequestCannotConfirmNewClaim' in tests
          assert 'lateErrorAndDuplicateReplyCannotCorruptLatestClaim' in tests
          assert 'AUDIO T98: rtsp_eof_resource' in air
          assert 'ownership=unverified' in helper
          assert 'mainAudioClaimAttempts' in helper
          assert 'never-log-this-vehicle-secret' in tests
          assert 'RTSP/1.0 200 OK' in tests
          PY
      - name: Read-only resource evidence JVM regression
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests io.github.shaonialife.cardeck.airplay.B233ResourceEofEvidenceTest --stacktrace
      - name: Complete Android JUnit, Lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

# L3 Draft only: no signing, Release, installation, packet/VPN changes or stable merge.
